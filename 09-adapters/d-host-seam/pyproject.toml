[project]
name = "cwa-workshop-09d-host-seam"
version = "0.1.0"
description = "W9 module D. Host and framework seams: fullsend's briefing, rebuilt in Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "contextwindowarchitecture-assembler",
]

[tool.uv]
package = false

[tool.uv.sources]
contextwindowarchitecture-assembler = { git = "https://github.com/contextwindowarchitecture/assembler-python", tag = "draft-release" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

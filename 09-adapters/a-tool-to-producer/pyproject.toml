[project]
name = "cwa-workshop-09a-tool-to-producer"
version = "0.1.0"
description = "W9 module A. Tool-to-producer adapters"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "contextwindowarchitecture-assembler",
    "llama-index-core>=0.14",
    "llama-index-retrievers-bm25>=0.8",
    "mcp>=2.2",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.sources]
contextwindowarchitecture-assembler = { git = "https://github.com/contextwindowarchitecture/assembler-python", tag = "draft-release" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "cwa-workshop-03-integration"
version = "0.1.0"
description = "W3a. Integrating CWA into an existing application"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "contextwindowarchitecture-assembler",
    "openai>=2",
]

[tool.uv]
package = false

[tool.uv.sources]
contextwindowarchitecture-assembler = { git = "https://github.com/contextwindowarchitecture/assembler-python", tag = "draft-release" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

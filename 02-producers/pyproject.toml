[project]
name = "cwa-workshop-02-producers"
version = "0.1.0"
description = "W2. Building a conformant producer"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "contextwindowarchitecture-assembler",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1",
]

[tool.uv]
package = false

# The assembler is a draft release on GitHub, not yet on PyPI. Pinned to the tag shared/contract/pins.json names.
[tool.uv.sources]
contextwindowarchitecture-assembler = { git = "https://github.com/contextwindowarchitecture/assembler-python", tag = "draft-release" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

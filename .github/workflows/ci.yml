# Model-free checks: the vendored contract matches its lock, no participant code assembles or patches a payload,
# the glossary is current against the website sibling, and every workshop that has committed scenarios still
# assembles them to the same bytes. Siblings are cloned beside the checkout at the refs shared/contract/pins.json
# names, which is the layout participants use. No model is called.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-lint:
    name: contract lock and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 shared/tools/vendor_contract.py --verify
      - run: python3 shared/tools/lint_no_assemble.py
      - run: python3 shared/siblings.py

  scenarios:
    name: scenarios (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          path: workshop
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: clone the siblings the labs read
        working-directory: workshop
        run: python3 shared/tools/clone_siblings.py examples assembler-python website
      - name: glossary is current
        working-directory: workshop
        run: python3 shared/tools/glossary.py --check
      - name: every committed scenario still assembles to the same bytes
        working-directory: workshop
        run: python3 shared/tools/check_scenarios.py

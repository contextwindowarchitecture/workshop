<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Same snapshot, same bytes, every time</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">A trace is only worth reading if any machine, any day, gives the same payload.</p>

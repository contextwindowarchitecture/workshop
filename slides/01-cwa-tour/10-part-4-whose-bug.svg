<rect x="440" y="0" width="360" height="250" fill="#2453C9"></rect>
<text x="468" y="56" font-size="26" font-weight="600" fill="#FFFFFF">CWA</text>
<text x="468" y="90" font-size="26" font-weight="600" fill="#FFFFFF">decisions</text>
<text x="468" y="146" font-size="18" fill="#FFFFFF">+ included</text>
<text x="468" y="176" font-size="18" fill="#FFFFFF">- excluded · reason</text>
<text x="468" y="206" font-size="18" fill="#FFFFFF">× 4 assemblers</text>
<line x1="800" y1="125" x2="870" y2="125" stroke="#11151B" stroke-width="2" marker-end="url(#p4)"></line>
<rect x="880" y="0" width="360" height="250" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="908" y="56" font-size="26" font-weight="600" fill="#11151B">outbound</text>
<text x="908" y="90" font-size="26" font-weight="600" fill="#11151B">request</text>
<text x="908" y="160" font-size="18" fill="#4A5361">{ "system": …,</text>
<text x="908" y="188" font-size="18" fill="#4A5361">  "messages": … }</text>
<line x1="1240" y1="125" x2="1310" y2="125" stroke="#11151B" stroke-width="2" marker-end="url(#p4)"></line>
<rect x="1320" y="0" width="360" height="250" fill="#FFFFFF" stroke="#11151B" stroke-width="2" stroke-dasharray="10 8"></rect>
<text x="1348" y="56" font-size="26" font-weight="600" fill="#11151B">model</text>
<text x="1348" y="90" font-size="26" font-weight="600" fill="#11151B">answer</text>
<text x="1348" y="160" font-size="18" fill="#4A5361">empty unless .env</text>
<text x="1348" y="188" font-size="18" fill="#4A5361">names a provider</text>
</g>
<g font-family="IBM Plex Sans, sans-serif">
<text x="0" y="310" font-size="20" fill="#4A5361">wrong candidate</text>
<text x="0" y="350" font-size="30" font-weight="700" fill="#11151B">producer bug</text>
<text x="440" y="310" font-size="20" fill="#4A5361">wrong decision</text>
<text x="440" y="350" font-size="30" font-weight="700" fill="#2453C9">assembler bug</text>
<text x="440" y="386" font-size="19" fill="#2E3540">four disagreeing is the alarm</text>
<text x="880" y="310" font-size="20" fill="#4A5361">wrong request, right payload</text>
<text x="880" y="350" font-size="30" font-weight="700" fill="#11151B">adapter bug</text>
<text x="1320" y="310" font-size="20" fill="#4A5361">wrong answer, right request</text>
<text x="1320" y="350" font-size="30" font-weight="700" fill="#C2541D">the model's</text>
<line x1="0" y1="430" x2="1680" y2="430" stroke="#DADFE7" stroke-width="2"></line>
<text x="0" y="478" font-size="22" fill="#2E3540">Watch for: basic 03 renders a forum post's markup escaped, never as structure · intermediate 04 shows two conflict groups</text>

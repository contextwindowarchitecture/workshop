<x-dc>
<helmet>

<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>FRAMING · THREE RESULTS</span>
<span>04 / 11</span>

<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Assembled, refused, rejected</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">The difference matters all day.</p>

<svg width="1680" height="660" viewBox="0 0 1680 660" role="img" aria-label="A snapshot is checked for validity. Invalid: rejected, only the problems. Valid: the assembler runs. Requirements met: assembled, payload and trace. A requirement cannot be met: refused, trace and reason, nothing reaches a model.">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace" fill="#11151B">
<rect x="0" y="270" width="220" height="90" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="30" y="324" font-size="24" font-weight="600">snapshot</text>
<line x1="220" y1="315" x2="320" y2="315" stroke="#11151B" stroke-width="2" marker-end="url(#ar)"></line>

<rect x="650" y="255" width="240" height="120" fill="#2453C9"></rect>
<text x="680" y="310" font-size="24" font-weight="600" fill="#FFFFFF">assembler</text>
<text x="680" y="342" font-size="17" fill="#FFFFFF">checks requirements</text>
<line x1="890" y1="290" x2="1000" y2="290" stroke="#11151B" stroke-width="2"></line>
<line x1="1000" y1="290" x2="1000" y2="110" stroke="#11151B" stroke-width="2"></line>
<line x1="1000" y1="110" x2="1110" y2="110" stroke="#11151B" stroke-width="2" marker-end="url(#ar)"></line>

<text x="912" y="377" font-size="17" fill="#4A5361">cannot be met</text>

<text x="1148" y="92" font-size="30" font-weight="600" fill="#2453C9">assembled</text>
<text x="1148" y="134" font-size="20">payload + trace</text>

<text x="1148" y="327" font-size="30" font-weight="600" fill="#C2541D">refused</text>

<text x="1148" y="540" font-size="20">no payload, no trace</text>
<text x="1148" y="570" font-size="18" fill="#4A5361">only the problems</text>
</g>
<g font-family="IBM Plex Sans, sans-serif" font-size="21" fill="#2E3540">
<text x="0" y="620">A refusal is an outcome of a valid snapshot. A rejection means the application built it wrong.</text>
</g>

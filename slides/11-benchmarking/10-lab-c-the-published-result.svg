<text x="24" y="470">The gain comes from state the application writes from</text>
<text x="24" y="496">what the user said, in a protected place every budget keeps.</text>
<text x="24" y="534">Model-written state is level with pinned truncation.</text>
<text x="24" y="560">History alone in CWA's format gains nothing.</text>
<text x="24" y="598" fill="#B9C3D6">The assembler was exact throughout: 220,608 assemblies.</text>

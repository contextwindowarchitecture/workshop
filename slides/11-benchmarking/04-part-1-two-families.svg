<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Part 1 Two families</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>PART 1 · 30 MINUTES</span>
<span>04 / 12</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Two families of benchmark</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Each holds something constant and varies one thing. Read which before you read a number.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="The examples bench holds one application constant and varies fourteen models. The viability benchmark's Domain 1 holds the specification constant and varies four assemblers. Domain 2 holds one model and everything else constant and varies the way the payload is built: eleven arms and two uncapped controls.">
<g font-family="IBM Plex Mono, monospace">
<g>
<rect x="0" y="0" width="540" height="640" fill="#FFFFFF" stroke="#2453C9" stroke-width="2"></rect>
<rect x="0" y="0" width="540" height="90" fill="#2453C9"></rect>
<text x="24" y="40" font-size="20" font-weight="600" fill="#FFFFFF">the examples bench</text>
<text x="24" y="70" font-size="15" fill="#DCE3F5">examples/bench</text>
<text x="24" y="136" font-size="15" font-weight="600" fill="#4A5361">HOLDS CONSTANT</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="170">one application (Fernway), its</text><text x="24" y="196">committed scenarios, the</text><text x="24" y="222">assembler at its pin</text></g>
<text x="24" y="290" font-size="15" font-weight="600" fill="#4A5361">VARIES</text>
<text x="24" y="340" font-size="40" font-weight="600" fill="#2453C9">14</text><text x="90" y="336" font-size="17" fill="#11151B">models on OpenRouter,</text>
<text x="90" y="360" font-size="17" fill="#11151B">ten repeats</text>
<text x="24" y="600" font-size="15" fill="#2453C9">Lab B</text>
</g>
<g>
<rect x="570" y="0" width="540" height="640" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<rect x="570" y="0" width="540" height="90" fill="#11151B"></rect>
<text x="594" y="40" font-size="20" font-weight="600" fill="#FFFFFF">viability · Domain 1</text>
<text x="594" y="70" font-size="15" fill="#B9C3D6">benchmark/domain1</text>
<text x="594" y="136" font-size="15" font-weight="600" fill="#4A5361">HOLDS CONSTANT</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="594" y="170">the specification at its pin</text></g>
<text x="594" y="290" font-size="15" font-weight="600" fill="#4A5361">VARIES</text>
<text x="594" y="340" font-size="40" font-weight="600" fill="#11151B">4</text><text x="660" y="336" font-size="17" fill="#11151B">assemblers, black boxes</text>
<text x="660" y="360" font-size="17" fill="#11151B">through the adapter protocol</text>
<text x="594" y="600" font-size="15" fill="#4A5361">no model anywhere</text>
</g>
<g>
<rect x="1140" y="0" width="540" height="640" fill="#FFFFFF" stroke="#C2541D" stroke-width="2"></rect>
<rect x="1140" y="0" width="540" height="90" fill="#C2541D"></rect>
<text x="1164" y="40" font-size="20" font-weight="600" fill="#FFFFFF">viability · Domain 2</text>
<text x="1164" y="70" font-size="15" fill="#FBF0EA">benchmark/domain2</text>
<text x="1164" y="136" font-size="15" font-weight="600" fill="#4A5361">HOLDS CONSTANT</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="1164" y="170">one model, its settings, the facts,</text><text x="1164" y="196">the user's turns, the budget, the</text><text x="1164" y="222">counter, the grader</text></g>
<text x="1164" y="290" font-size="15" font-weight="600" fill="#4A5361">VARIES</text>
<text x="1164" y="340" font-size="40" font-weight="600" fill="#C2541D">11</text><text x="1230" y="336" font-size="17" fill="#11151B">ways of building the</text>
<text x="1230" y="360" font-size="17" fill="#11151B">payload, from "concatenate</text>
<text x="1230" y="384" font-size="17" fill="#11151B">everything" to CWA's pipeline,</text>
<text x="1230" y="408" font-size="17" fill="#11151B">and two uncapped controls</text>
<text x="1164" y="600" font-size="15" fill="#C2541D">Lab C</text>
</g>
</g>
</svg>
</div>
</foreignObject>
</svg>

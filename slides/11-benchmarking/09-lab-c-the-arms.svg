<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Lab C The arms</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>PART 4 · LAB C · 60 MINUTES · DOMAIN 2</span>
<span>09 / 12</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Hold everything equal; change how the payload is built</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Over a long conversation, does CWA-assembled context keep a model on task where conventional context degrades?</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="Eleven arms and two controls in three groups: upper bounds with no budget; five conventional arms, concat, truncate, truncate-pinned, window and summary; and six CWA arms, history, state, model-written state, memory, pipeline and the format control. Below, the three columns the reader prints, the last telling a payload failure from a model failure.">
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="400" height="420" fill="#FFFFFF" stroke="#4A5361" stroke-width="2"></rect>
<text x="22" y="38" font-size="15" font-weight="600" fill="#4A5361">CONTROLS · NO BUDGET</text>
<text x="22" y="86" font-size="17" font-weight="600" fill="#11151B">control-full</text>
<text x="22" y="122" font-size="17" font-weight="600" fill="#11151B">control-concat</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#2E3540"><text x="22" y="164">the whole conversation:</text><text x="22" y="186">upper bounds</text></g>
<rect x="420" y="0" width="560" height="420" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="442" y="38" font-size="15" font-weight="600" fill="#4A5361">CONVENTIONAL · 5</text>
<text x="442" y="76" font-size="17" font-weight="600" fill="#11151B">concat</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#2E3540"><text x="442" y="98">every turn as chat; over budget, nothing is sent</text></g>
<text x="442" y="132" font-size="17" font-weight="600" fill="#11151B">truncate</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#2E3540"><text x="442" y="154">the newest turns that fit, system prompt dropped</text></g>
<rect x="436" y="172" width="528" height="72" fill="#EEF1F8" stroke="#2453C9" stroke-width="2"></rect>
<text x="452" y="200" font-size="17" font-weight="600" fill="#2453C9">truncate-pinned</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#11151B"><text x="452" y="226">system prompt pinned · the fair reference</text></g>
<text x="442" y="276" font-size="17" font-weight="600" fill="#11151B">window</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#2E3540"><text x="442" y="298">the last ten turns</text></g>
<text x="442" y="332" font-size="17" font-weight="600" fill="#11151B">summary</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#2E3540"><text x="442" y="354">last ten turns and a rolling summary the model</text><text x="442" y="374">writes: the strongest conventional control</text></g>
<rect x="1000" y="0" width="680" height="420" fill="#2453C9"></rect>
<text x="1022" y="38" font-size="15" font-weight="600" fill="#DCE3F5">CWA · 6</text>
<text x="1022" y="76" font-size="17" font-weight="600" fill="#FFFFFF">cwa-history</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#DCE3F5"><text x="1022" y="98">CWA's format, history only</text></g>
<text x="1022" y="132" font-size="17" font-weight="600" fill="#FFFFFF">cwa-state</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#DCE3F5"><text x="1022" y="154">plus state.task from the facts the user stated: the upper bound for state</text></g>
<text x="1022" y="188" font-size="17" font-weight="600" fill="#FFFFFF">cwa-state-x</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#DCE3F5"><text x="1022" y="210">plus state.task written by the model, turn by turn: the realistic arm</text></g>
<text x="1022" y="244" font-size="17" font-weight="600" fill="#FFFFFF">cwa-memory · cwa-pipeline</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#DCE3F5"><text x="1022" y="266">cwa-state with recent turns as history, older facts as memory;</text><text x="1022" y="288">the second adds supersession and deduplication</text></g>
<text x="1022" y="332" font-size="17" font-weight="600" fill="#FFFFFF">cwa-format</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#DCE3F5"><text x="1022" y="354">window's exact selection, rendered as CWA renders it:</text><text x="1022" y="374">the format control</text></g>
<text x="0" y="470" font-size="16" font-weight="600" fill="#4A5361">UV RUN DOMAIN2_READ.PY · PER ARM AND BUDGET</text>
<rect x="0" y="490" width="400" height="150" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="22" y="530" font-size="17" font-weight="600" fill="#11151B">aptitude</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#2E3540"><text x="22" y="566">the share of probes</text><text x="22" y="590">answered right</text></g>
<rect x="420" y="490" width="560" height="150" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="442" y="530" font-size="17" font-weight="600" fill="#11151B">95% interval</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#2E3540"><text x="442" y="566">a bootstrap over conversations</text></g>
<rect x="1000" y="490" width="680" height="150" fill="#FBF0EA" stroke="#C2541D" stroke-width="3"></rect>
<text x="1022" y="530" font-size="17" font-weight="600" fill="#C2541D">fact in payload · the one to learn</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#11151B"><text x="1022" y="566">wrong, fact absent: the payload's failure</text><text x="1022" y="592">wrong, fact present: the model's</text></g>
</g>
</svg>
</div>
</foreignObject>
</svg>

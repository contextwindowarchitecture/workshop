<text x="0" y="524" font-size="17" fill="#11151B">02-member-not-offered · Ben is a Member and asks for list_members. Which mechanism stopped the call?</text>
<text x="0" y="560" font-size="17" font-weight="600" fill="#11151B">Both: the policy never offered it (capability_not_allowed, stage producer); the guard denied it as not offered.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Observation or denial</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>FRAMING · R-25, R-8</span>
<span>04 / 10</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">A tool result is an observation, not permission</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">And a denied call is not an observation at all.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-label="An allowed call reaches the server and its result renders as evidence with observation authority, marked untrusted_content, keyed by the call. A denied call never reaches the server; next turn it comes back as state.task written by the application.">
<defs>
<marker id="ob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="230" width="260" height="110" fill="#C2541D"></rect>
<text x="24" y="280" font-size="22" font-weight="600" fill="#FFFFFF">guard</text>
<text x="24" y="310" font-size="15" fill="#FFFFFF">the verdict</text>
<path d="M 260 260 C 320 260, 320 110, 380 110" fill="none" stroke="#11151B" stroke-width="2" marker-end="url(#ob)"></path>
<text x="290" y="160" font-size="16" fill="#2453C9">allowed</text>
<path d="M 260 310 C 320 310, 320 460, 380 460" fill="none" stroke="#11151B" stroke-width="2" marker-end="url(#ob)"></path>
<text x="290" y="420" font-size="16" fill="#C2541D">denied</text>
<rect x="390" y="60" width="260" height="100" fill="#11151B"></rect>
<text x="414" y="104" font-size="19" font-weight="600" fill="#FFFFFF">MCP server</text>
<text x="414" y="132" font-size="15" fill="#B9C3D6">runs the call</text>
<line x1="650" y1="110" x2="730" y2="110" stroke="#11151B" stroke-width="2" marker-end="url(#ob)"></line>
<rect x="740" y="0" width="940" height="230" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="768" y="44" font-size="22" font-weight="600" fill="#2453C9">observation</text>
<g font-size="17" fill="#11151B">
<text x="768" y="88">renders as evidence inside the user message</text>
<text x="768" y="120">authority: observation</text>
<text x="768" y="152">marked: untrusted_content</text>
<text x="768" y="184">keyed by the call: a repeat supersedes it (R-25)</text>
</g>
<text x="768" y="214" font-size="15" fill="#4A5361">information about the world, never permission to act</text>
<rect x="390" y="410" width="260" height="100" fill="#FFFFFF" stroke="#C2541D" stroke-width="2" stroke-dasharray="8 6"></rect>
<text x="414" y="454" font-size="19" font-weight="600" fill="#C2541D">no server call</text>
<text x="414" y="482" font-size="15" fill="#2E3540">no fake result</text>
<line x1="650" y1="460" x2="730" y2="460" stroke="#11151B" stroke-width="2" marker-end="url(#ob)"></line>
<text x="664" y="448" font-size="14" fill="#4A5361">next turn</text>
<rect x="740" y="340" width="940" height="230" fill="#FFFFFF" stroke="#11151B" stroke-width="3"></rect>
<text x="768" y="384" font-size="22" font-weight="600" fill="#11151B">state.task</text>
<g font-size="17" fill="#11151B">
<text x="768" y="428">written by the application, not by the model</text>
<text x="768" y="460">what was denied, and why (R-8)</text>
<text x="768" y="492">the model reads it and can tell the user</text>
</g>
</g>
</svg>
</div>
</foreignObject>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Agenda</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>AGENDA · FOUR HOURS INSTRUCTOR-LED</span>
<span>02 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Two given, three written, five broken</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">This directory plus the vendored contract. Set <span style="font-family: 'IBM Plex Mono', monospace">CWA_W2_IMPL=labs</span>, or the tests run the solution.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="390" viewBox="0 0 1680 390" role="img" aria-label="240 minute timeline: framing 10, part 1 20, lab A 60, break 15, lab B 40, lab C 30, break 10, lab D 40, part 6 15; conference cut is part 1, lab A and lab D">
<g font-family="IBM Plex Mono, monospace">
<text x="0" y="24" font-size="18" fill="#4A5361">FULL · 240 MIN</text>
<rect x="0" y="40" width="70" height="100" fill="#11151B"></rect>
<rect x="70" y="40" width="140" height="100" fill="#2453C9"></rect>
<rect x="210" y="40" width="420" height="100" fill="#1A3D96"></rect>
<rect x="630" y="40" width="105" height="100" fill="#DADFE7"></rect>
<rect x="735" y="40" width="280" height="100" fill="#2453C9"></rect>
<rect x="1015" y="40" width="210" height="100" fill="#1A3D96"></rect>
<rect x="1225" y="40" width="70" height="100" fill="#DADFE7"></rect>
<rect x="1295" y="40" width="280" height="100" fill="#C2541D"></rect>
<rect x="1575" y="40" width="105" height="100" fill="#11151B"></rect>
<g stroke="#F4F5F7" stroke-width="3">
<line x1="70" y1="40" x2="70" y2="140"></line>
<line x1="210" y1="40" x2="210" y2="140"></line>
<line x1="630" y1="40" x2="630" y2="140"></line>
<line x1="735" y1="40" x2="735" y2="140"></line>
<line x1="1015" y1="40" x2="1015" y2="140"></line>
<line x1="1225" y1="40" x2="1225" y2="140"></line>
<line x1="1295" y1="40" x2="1295" y2="140"></line>
<line x1="1575" y1="40" x2="1575" y2="140"></line>
</g>
<g font-size="22" font-weight="600" fill="#FFFFFF">
<text x="90" y="98">part 1</text>
<text x="230" y="98">lab A · retrieval</text>
<text x="755" y="98">lab B · memory</text>
<text x="1035" y="98">lab C · state</text>
<text x="1315" y="98">lab D · negatives</text>
<text x="1595" y="98">6</text>
</g>
<text x="648" y="98" font-size="18" fill="#11151B">break</text>
<g font-size="17" fill="#4A5361">
<text x="0" y="170">0</text>
<text x="60" y="170">10</text>
<text x="198" y="170">30</text>
<text x="618" y="170">90</text>
<text x="717" y="170">105</text>
<text x="997" y="170">145</text>
<text x="1207" y="170">175</text>
<text x="1277" y="170">185</text>
<text x="1557" y="170">225</text>
<text x="1644" y="170">240</text>
</g>
<text x="210" y="208" font-size="17" fill="#2E3540">stop at 60: two duplicate rows, then the squeeze</text>
<text x="0" y="284" font-size="18" fill="#4A5361">CONFERENCE CUT · 90 MIN</text>
<rect x="0" y="300" width="1680" height="40" fill="#FFFFFF" stroke="#DADFE7"></rect>
<rect x="70" y="300" width="140" height="40" fill="#2453C9"></rect>
<rect x="210" y="300" width="420" height="40" fill="#1A3D96"></rect>
<rect x="1295" y="300" width="280" height="40" fill="#C2541D"></rect>
</g>
</svg>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 32px; font-size: 22px; line-height: 1.4">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">Part 1</span><span>Two producers you are given; run the finished route once.</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #1A3D96">Lab A</span><span>Retrieval: dedupe, report, precomputed variants.</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">Labs B and C</span><span>Memory with expiry and scope; state read from the system of record.</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #C2541D">Lab D</span><span>Five items, each wrong in exactly one way.</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">Part 6</span><span>The checklist, against your own producer.</span></div>
</div>
</div>
</foreignObject>
</svg>

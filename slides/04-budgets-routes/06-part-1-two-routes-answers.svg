<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Part 1 Two routes</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>PART 1 · 20 MINUTES · SOLUTION/ROUTES.JSON</span>
<span>06 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">One application, two routes</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">W3a's application. <span style="font-family: 'IBM Plex Mono', monospace">budget.input</span> is computed from two numbers, never typed (R-16).</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="620" viewBox="0 0 1680 620" role="img" aria-label="Small route: a 2048-token model reserving 512. Large route: an 8192-token model reserving 1024. Every request starts small; the pasted log refuses protected_content_over_budget and escalates to a new snapshot on the large route.">
<defs>
<marker id="p4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<text x="0" y="22" font-size="18" font-weight="600" fill="#11151B">small · 2048-token model</text>
<rect x="0" y="36" width="315" height="56" fill="#2453C9"></rect>
<text x="14" y="70" font-size="16" fill="#FFFFFF">input 2048 - 512 = 1536</text>
<rect x="315" y="36" width="105" height="56" fill="#C2541D"></rect>
<text x="325" y="70" font-size="15" fill="#FFFFFF">512</text>
<text x="0" y="140" font-size="18" font-weight="600" fill="#11151B">large · 8192-token model</text>
<rect x="0" y="154" width="1470" height="56" fill="#1A3D96"></rect>
<text x="14" y="188" font-size="16" fill="#FFFFFF">input 8192 - 1024 = 7168</text>
<rect x="1470" y="154" width="210" height="56" fill="#C2541D"></rect>
<text x="1486" y="188" font-size="15" fill="#FFFFFF">reserved 1024</text>
<text x="460" y="70" font-size="16" fill="#4A5361">reserved_output, held back for the answer · both routes carry a margin</text>
<line x1="0" y1="250" x2="1680" y2="250" stroke="#DADFE7" stroke-width="2"></line>
<text x="0" y="296" font-size="18" font-weight="600" fill="#4A5361">03-PASTED-LOG · A SIXTY-LINE WORKER LOG IN THE QUESTION</text>
<rect x="0" y="320" width="320" height="110" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="22" y="362" font-size="18" fill="#11151B">every request</text>
<text x="22" y="390" font-size="18" fill="#11151B">starts small</text>
<line x1="320" y1="375" x2="390" y2="375" stroke="#11151B" stroke-width="2" marker-end="url(#p4)"></line>
<rect x="400" y="320" width="460" height="110" fill="#FBF0EA" stroke="#C2541D" stroke-width="2"></rect>
<text x="422" y="356" font-size="17" font-weight="600" fill="#C2541D">protected_content_over_budget</text>
<text x="422" y="384" font-size="15" fill="#11151B">the query is protected; refused</text>
<text x="422" y="408" font-size="15" fill="#11151B">before reducing anything</text>
<line x1="860" y1="375" x2="930" y2="375" stroke="#11151B" stroke-width="2" marker-end="url(#p4)"></line>
<rect x="940" y="320" width="300" height="110" fill="#11151B"></rect>
<text x="962" y="362" font-size="18" fill="#FFFFFF">escalate table</text>
<text x="962" y="392" font-size="15" fill="#B9C3D6">refusal reason: route</text>
<line x1="1240" y1="375" x2="1310" y2="375" stroke="#11151B" stroke-width="2" marker-end="url(#p4)"></line>
<rect x="1320" y="320" width="360" height="110" fill="#2453C9"></rect>
<text x="1342" y="356" font-size="17" font-weight="600" fill="#FFFFFF">large route</text>
<text x="1342" y="384" font-size="15" fill="#FFFFFF">a new snapshot, built</text>
<text x="1342" y="408" font-size="15" fill="#FFFFFF">and assembled (R-12, R-17)</text>
<text x="0" y="490" font-size="18" fill="#11151B">Two tables print, one per attempt.</text>
<text x="0" y="540" font-size="16" fill="#4A5361">CHECKPOINT 1 · each route's budget.input and how it was computed; the codes that escalate:</text>
<text x="0" y="574" font-size="18" font-weight="600" fill="#11151B">protected_content_over_budget · evidence_required</text>
</g>
</svg>
</div>
</foreignObject>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Lab B Escalation table</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>LAB B · 40 MINUTES · LABS/ROUTES.JSON</span>
<span>08 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Which refusals deserve a second attempt?</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Both routes, no escalate table. Write it, and defend each entry in one sentence.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-label="A table of refusal reasons on the small route and whether each should rebuild the request on the large route">
<g font-family="IBM Plex Mono, monospace">
<text x="0" y="22" font-size="17" font-weight="600" fill="#4A5361">REFUSED ON THE SMALL ROUTE</text>
<text x="560" y="22" font-size="17" font-weight="600" fill="#4A5361">ESCALATE?</text>
<text x="760" y="22" font-size="17" font-weight="600" fill="#4A5361">WHY</text>
<line x1="0" y1="40" x2="1680" y2="40" stroke="#11151B" stroke-width="2"></line>
<g font-size="19" fill="#11151B">
<text x="0" y="90">protected_content_over_budget</text>
<text x="0" y="170">slot_floor_over_budget</text>
<text x="0" y="250">evidence_required</text>
<text x="0" y="330">conflict_unresolved</text>
<text x="0" y="410">required_slot_missing</text>
</g>
<g font-size="20" font-weight="600">
<text x="560" y="90" fill="#2453C9">yes</text>
<text x="560" y="170" fill="#C2541D">no</text>
<text x="560" y="250" fill="#2453C9">yes</text>
<text x="560" y="330" fill="#C2541D">no</text>
<text x="560" y="410" fill="#C2541D">no</text>
</g>
<g font-size="16" fill="#2E3540" font-family="IBM Plex Sans, sans-serif">
<text x="760" y="90">A bigger budget can hold the protected content.</text>
<text x="760" y="170">The solution leaves it out; a defensible table may differ.</text>
<text x="760" y="242">Only helps when evidence was omitted for budget (precompute_summary, retrieve_narrower).</text>
<text x="760" y="266">With request_context nothing was omitted: a bigger model changes nothing.</text>
<text x="760" y="330">The large route resolves nothing the small one could not.</text>
<text x="760" y="410">A second attempt that cannot succeed is cost without benefit.</text>
</g>
<g stroke="#DADFE7" stroke-width="1.5">
<line x1="0" y1="120" x2="1680" y2="120"></line>
<line x1="0" y1="200" x2="1680" y2="200"></line>
<line x1="0" y1="290" x2="1680" y2="290"></line>
<line x1="0" y1="360" x2="1680" y2="360"></line>
<line x1="0" y1="440" x2="1680" y2="440"></line>
</g>
<text x="0" y="500" font-size="17" font-weight="600" fill="#4A5361">THEN CHANGE A ROUTE AND WATCH WHICH SCENARIO MOVES</text>
<g font-size="17" fill="#11151B">
<rect x="0" y="520" width="520" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="1.5"></rect><text x="20" y="558">lower min_included</text>
<rect x="580" y="520" width="520" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="1.5"></rect><text x="600" y="558">a min_tokens floor on knowledge</text>
<rect x="1160" y="520" width="520" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="1.5"></rect><text x="1180" y="558">reorder fitting_order</text>
</g>
</g>
</svg>
</div>
</foreignObject>
</svg>

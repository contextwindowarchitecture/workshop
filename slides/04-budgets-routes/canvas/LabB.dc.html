<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab B Escalation table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453C9}a:hover{color:#1A3D96}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>LAB B · 40 MINUTES · LABS/ROUTES.JSON</span>
<span>08 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Which refusals deserve a second attempt?</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Both routes, no escalate table. Write it, and defend each entry in one sentence.</p>
</div>
<svg width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-label="A table of refusal reasons on the small route and whether each should rebuild the request on the large route">
<g font-family="IBM Plex Mono, monospace">
<text x="0" y="22" font-size="17" font-weight="600" fill="#4A5361">REFUSED ON THE SMALL ROUTE</text>
<text x="560" y="22" font-size="17" font-weight="600" fill="#4A5361">ESCALATE?</text>
<text x="760" y="22" font-size="17" font-weight="600" fill="#4A5361">WHY</text>
<line x1="0" y1="40" x2="1680" y2="40" stroke="#11151B" stroke-width="2"></line>
<g font-size="19" fill="#11151B">
<text x="0" y="90">protected_content_over_budget</text>
<text x="0" y="170">slot_floor_over_budget</text>
<text x="0" y="250">evidence_required</text>
<text x="0" y="330">conflict_unresolved</text>
<text x="0" y="410">required_slot_missing</text>
</g>
<g font-size="20" font-weight="600">
<text x="560" y="90" fill="{{e1.c}}">{{e1.v}}</text>
<text x="560" y="170" fill="{{e2.c}}">{{e2.v}}</text>
<text x="560" y="250" fill="{{e3.c}}">{{e3.v}}</text>
<text x="560" y="330" fill="{{e4.c}}">{{e4.v}}</text>
<text x="560" y="410" fill="{{e5.c}}">{{e5.v}}</text>
</g>
<g font-size="16" fill="#2E3540" font-family="IBM Plex Sans, sans-serif">
<text x="760" y="90">{{w1}}</text>
<text x="760" y="170">{{w2}}</text>
<text x="760" y="242">{{w3}}</text>
<text x="760" y="266">{{w3b}}</text>
<text x="760" y="330">{{w4}}</text>
<text x="760" y="410">{{w5}}</text>
</g>
<g stroke="#DADFE7" stroke-width="1.5">
<line x1="0" y1="120" x2="1680" y2="120"></line>
<line x1="0" y1="200" x2="1680" y2="200"></line>
<line x1="0" y1="290" x2="1680" y2="290"></line>
<line x1="0" y1="360" x2="1680" y2="360"></line>
<line x1="0" y1="440" x2="1680" y2="440"></line>
</g>
<text x="0" y="500" font-size="17" font-weight="600" fill="#4A5361">THEN CHANGE A ROUTE AND WATCH WHICH SCENARIO MOVES</text>
<g font-size="17" fill="#11151B">
<rect x="0" y="520" width="520" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="1.5"></rect><text x="20" y="558">lower min_included</text>
<rect x="580" y="520" width="520" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="1.5"></rect><text x="600" y="558">a min_tokens floor on knowledge</text>
<rect x="1160" y="520" width="520" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="1.5"></rect><text x="1180" y="558">reorder fitting_order</text>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.showAnswers ?? false;
    const yes = { v: 'yes', c: '#2453C9' }, no = { v: 'no', c: '#C2541D' }, q = { v: '?', c: '#9AA3B0' };
    return {
      e1: s ? yes : q, e2: s ? no : q, e3: s ? yes : q, e4: s ? no : q, e5: s ? no : q,
      w1: s ? 'A bigger budget can hold the protected content.' : '',
      w2: s ? 'The solution leaves it out; a defensible table may differ.' : '',
      w3: s ? 'Only helps when evidence was omitted for budget (precompute_summary, retrieve_narrower).' : '',
      w3b: s ? 'With request_context nothing was omitted: a bigger model changes nothing.' : '',
      w4: s ? 'The large route resolves nothing the small one could not.' : '',
      w5: s ? 'A second attempt that cannot succeed is cost without benefit.' : ''
    };
  }
}
</script>
</body>
</html>

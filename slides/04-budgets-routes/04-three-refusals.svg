<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Three refusals</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>FRAMING · THE REFUSALS THAT BELONG TO FITTING</span>
<span>04 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Three refusals, each with a way out</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Each is an outcome, not an error. Nothing reaches a model (R-17).</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="620" viewBox="0 0 1680 620" role="img" aria-label="protected_content_over_budget, slot_floor_over_budget and evidence_required, with when each happens and its recovery. evidence_required's recovery depends on what was omitted for budget.">
<defs>
<marker id="rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="540" height="250" fill="#FFFFFF" stroke="#C2541D" stroke-width="3"></rect>
<text x="26" y="44" font-size="19" font-weight="600" fill="#C2541D">protected_content_over_budget</text>
<text x="26" y="92" font-size="16" fill="#11151B">the protected items alone do not</text>
<text x="26" y="116" font-size="16" fill="#11151B">fit; nothing is reduced first</text>
<text x="26" y="180" font-size="15" fill="#4A5361">way out</text>
<text x="26" y="206" font-size="16" fill="#2453C9">a bigger route, or less</text>
<text x="26" y="228" font-size="16" fill="#2453C9">protected content</text>
<rect x="570" y="0" width="540" height="250" fill="#FFFFFF" stroke="#C2541D" stroke-width="3"></rect>
<text x="596" y="44" font-size="19" font-weight="600" fill="#C2541D">slot_floor_over_budget</text>
<text x="596" y="92" font-size="16" fill="#11151B">the payload fits only by breaking</text>
<text x="596" y="116" font-size="16" fill="#11151B">a min_tokens floor</text>
<text x="596" y="180" font-size="15" fill="#4A5361">way out</text>
<text x="596" y="206" font-size="16" fill="#2453C9">a bigger route, or a lower floor</text>
<rect x="1140" y="0" width="540" height="250" fill="#FFFFFF" stroke="#C2541D" stroke-width="3"></rect>
<text x="1166" y="44" font-size="19" font-weight="600" fill="#C2541D">evidence_required</text>
<text x="1166" y="92" font-size="16" fill="#11151B">a route that requires evidence has</text>
<text x="1166" y="116" font-size="16" fill="#11151B">too little left after fitting</text>
<text x="1166" y="180" font-size="15" fill="#4A5361">way out</text>
<text x="1166" y="206" font-size="16" fill="#2453C9">as the trace says (R-12): below</text>
<text x="0" y="310" font-size="18" font-weight="600" fill="#4A5361">WHICH RECOVERY FOR EVIDENCE_REQUIRED</text>
<polygon points="420,330 600,410 420,490 240,410" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></polygon>
<text x="420" y="402" font-size="16" fill="#11151B" text-anchor="middle">evidence omitted</text>
<text x="420" y="426" font-size="16" fill="#11151B" text-anchor="middle">for budget?</text>
<line x1="240" y1="410" x2="200" y2="410" stroke="#11151B" stroke-width="2"></line>
<line x1="200" y1="410" x2="200" y2="520" stroke="#11151B" stroke-width="2" marker-end="url(#rf)"></line>
<text x="160" y="400" font-size="15" fill="#4A5361">no</text>
<rect x="0" y="530" width="400" height="70" fill="#11151B"></rect>
<text x="22" y="572" font-size="18" fill="#FFFFFF">request_context</text>
<line x1="600" y1="410" x2="700" y2="410" stroke="#11151B" stroke-width="2" marker-end="url(#rf)"></line>
<text x="620" y="398" font-size="15" fill="#4A5361">yes</text>
<polygon points="890,330 1070,410 890,490 710,410" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></polygon>
<text x="890" y="402" font-size="16" fill="#11151B" text-anchor="middle">did it have</text>
<text x="890" y="426" font-size="16" fill="#11151B" text-anchor="middle">variants?</text>
<line x1="890" y1="490" x2="890" y2="520" stroke="#11151B" stroke-width="2" marker-end="url(#rf)"></line>
<text x="904" y="512" font-size="15" fill="#4A5361">no</text>
<rect x="690" y="530" width="400" height="70" fill="#11151B"></rect>
<text x="712" y="572" font-size="18" fill="#FFFFFF">precompute_summary</text>
<line x1="1070" y1="410" x2="1170" y2="410" stroke="#11151B" stroke-width="2" marker-end="url(#rf)"></line>
<text x="1090" y="398" font-size="15" fill="#4A5361">yes</text>
<rect x="1180" y="375" width="400" height="70" fill="#11151B"></rect>
<text x="1202" y="417" font-size="18" fill="#FFFFFF">retrieve_narrower</text>
</g>
</svg>
</div>
</foreignObject>
</svg>

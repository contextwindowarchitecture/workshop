<x-dc>
<helmet>

<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">

<span>08 / 09</span>

<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">The eleventh defect: every case still passes</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Found while authoring the kata, and not injected. A gap in the suite, not in the assembler.</p>
</div>
<svg width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-label="A one-line change to the conflict tie-break in conflicts.py drops the freshness_tiebreak permission check. Every published case still passes. W10 writes the case that would catch it.">
<g font-family="IBM Plex Mono, monospace">
<text x="0" y="22" font-size="17" font-weight="600" fill="#4A5361">SRC/CWA/CONFLICTS.PY · tiebreak-without-permission</text>
<rect x="0" y="40" width="1680" height="64" fill="#FFFFFF" stroke="#2453C9" stroke-width="2"></rect>
<text x="20" y="80" font-size="19" fill="#2453C9">-</text>
<text x="52" y="80" font-size="19" fill="#11151B">if not policy.get("freshness_tiebreak", False) or not newest:</text>
<rect x="0" y="112" width="1680" height="64" fill="#FBF0EA" stroke="#C2541D" stroke-width="2"></rect>
<text x="20" y="152" font-size="19" fill="#C2541D">+</text>
<text x="52" y="152" font-size="19" fill="#11151B">if not newest:</text>
<g font-family="IBM Plex Sans, sans-serif">
<text x="0" y="232" font-size="21" fill="#11151B">Freshness may break a tie between leaders only when the route's fact policy permits it (R-11).</text>
<text x="0" y="264" font-size="21" fill="#11151B">Without the check, a group the route meant to surface or refuse is decided by the clock.</text>
</g>
<rect x="0" y="310" width="520" height="140" fill="#2453C9"></rect>
<text x="24" y="356" font-size="20" font-weight="600" fill="#FFFFFF">every published case</text>

<rect x="560" y="310" width="1120" height="230" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="584" y="350" font-size="17" font-weight="600" fill="#4A5361">CHECKPOINT 3 · THE CASE YOU WOULD WRITE</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="{{ink}}">
<text x="584" y="396">{{c1}}</text>
<text x="584" y="426">{{c2}}</text>
<text x="584" y="456">{{c3}}</text>
<text x="584" y="486">{{c4}}</text>
</g>
<rect x="0" y="470" width="520" height="70" fill="#11151B"></rect>
<text x="24" y="514" font-size="18" fill="#FFFFFF">W10 starts here</text>
<text x="0" y="586" font-size="16" fill="#4A5361">W10 writes it in the specification repository's generators and runs all four assemblers against it.</text>
</g>

<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.showAnswers ?? false;
    return {
      ink: s ? '#11151B' : '#9AA3B0',
      c1: s ? 'A fact group with two leaders from the top producer,' : 'A snapshot, a route, and the expected trace:',
      c2: s ? 'with different freshness,' : 'which group, which policy, which outcome?',
      c3: s ? 'and freshness_tiebreak absent or false.' : '',
      c4: s ? 'Expected: escalated, and the route says surface or refuse.' : ''
    };
  }
}
</script>

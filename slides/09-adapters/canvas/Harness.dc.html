<!doctype html>
<html lang="en">
<head>

<title>B The harness</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453C9}a:hover{color:#1A3D96}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>MODULE B · THE LAB AND PART 3 · R-21 · R-23</span>
<span>08 / 13</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Judge any assembler without reading its code</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Write the adapter, run the suite by the published pass rule, then compare adapters on the same bytes.</p>
</div>
<svg width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="Three columns. The pass rule over sixty-five cases and twenty-five rejections. The lab's four common mistakes and checkpoint 2. Compare and agreement: the first difference as a JSON pointer, four languages and one payload hash.">
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="540" height="640" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="24" y="40" font-size="17" font-weight="600" fill="#4A5361">HARNESS.PY CONFORMANCE</text>
<text x="24" y="104" font-size="56" font-weight="600" fill="#2453C9">65</text><text x="130" y="104" font-size="18" fill="#11151B">cases</text>
<text x="24" y="170" font-size="56" font-weight="600" fill="#2453C9">25</text><text x="130" y="170" font-size="18" fill="#11151B">rejections</text>
<text x="24" y="232" font-size="16" font-weight="600" fill="#11151B">the pass rule</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#2E3540">
<text x="24" y="268">payload bytes equal</text>
<text x="24" y="300">trace equal field for field, with</text>
<text x="24" y="326">trace_id, timings and</text>
<text x="24" y="352">recovery.detail removed</text>
<text x="24" y="384">an optional component the</text>
<text x="24" y="410">adapter lacks: skipped, not failed</text>
</g>
<text x="24" y="478" font-size="14" fill="#4A5361">the report: conformance_report</text>
<text x="24" y="500" font-size="14" fill="#4A5361">.schema.json shape, naming the</text>
<text x="24" y="522" font-size="14" fill="#4A5361">contract commit from the lock</text>
<rect x="570" y="0" width="540" height="640" fill="#FFFFFF" stroke="#2453C9" stroke-width="2"></rect>
<text x="594" y="40" font-size="17" font-weight="600" fill="#2453C9">LABS/ADAPTER.PY · 60 MIN</text>
<text x="594" y="80" font-size="15" fill="#4A5361">the tests catch</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="594" y="120">a stray print to stdout</text>
<text x="594" y="160">a non-JSON input treated as</text>
<text x="594" y="186">a crash, not a rejection</text>
<text x="594" y="226">the exit 3 sentence worded</text>
<text x="594" y="252">differently</text>
<text x="594" y="292">the order of checks: validate</text>
<text x="594" y="318">first, resolve components after</text>
</g>
<rect x="594" y="380" width="492" height="230" fill="#EEF1F8"></rect>
<text x="614" y="416" font-size="15" font-weight="600" fill="#4A5361">CHECKPOINT 2 · THE ONE LINE</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="{{ink}}">
<text x="614" y="456">{{b1}}</text><text x="614" y="484">{{b2}}</text><text x="614" y="512">{{b3}}</text><text x="614" y="540">{{b4}}</text>
</g>
<rect x="1140" y="0" width="540" height="640" fill="#11151B"></rect>
<text x="1164" y="40" font-size="17" font-weight="600" fill="#B9C3D6">PART 3 · COMPARE, AGREE</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#FFFFFF">
<text x="1164" y="90">The first difference between</text>
<text x="1164" y="116">adapters, as a JSON pointer,</text>
<text x="1164" y="142">in UTF-16 key order.</text>
</g>
<text x="1164" y="200" font-size="15" fill="#B9C3D6">change one token count in a</text>
<text x="1164" y="222" font-size="15" fill="#B9C3D6">copy of an expected trace:</text>
<rect x="1164" y="240" width="492" height="56" fill="#2453C9"></rect>
<text x="1184" y="276" font-size="19" fill="#FFFFFF">{{ptr}}</text>
<text x="1164" y="360" font-size="15" fill="#B9C3D6">harness.py agreement, with</text>
<text x="1164" y="382" font-size="15" fill="#B9C3D6">assembler-demo built:</text>
<g font-size="16" fill="#FFFFFF"><text x="1164" y="424">Python</text><text x="1290" y="424">Go</text><text x="1350" y="424">Rust</text><text x="1430" y="424">TypeScript</text></g>
<rect x="1164" y="444" width="492" height="56" fill="#FFFFFF"></rect>
<text x="1184" y="480" font-size="19" fill="#11151B">{{four}}</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#B9C3D6">
<text x="1164" y="560">A disagreement is a bug in one of</text>
<text x="1164" y="586">them or a gap in the specification.</text>
<text x="1164" y="612">It goes to W10.</text>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.showAnswers ?? false;
    return {
      ink: s ? '#11151B' : '#9AA3B0',
      b1: s ? 'The except clauses: SnapshotError is 2,' : 'Which line decides between',
      b2: s ? 'UnsupportedComponentError is 3.' : 'exit 2 and exit 3?',
      b3: s ? 'Snapshot.from_json validates before' : '',
      b4: s ? 'it resolves components.' : '',
      ptr: s ? '/included/0/tokens' : 'which pointer?',
      four: s ? 'one hash' : 'how many hashes?'
    };
  }
}
</script>

<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">The host already knows who may speak</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Repository permission decides who is user in the thread and whose words are evidence. The wording decides nothing.</p>

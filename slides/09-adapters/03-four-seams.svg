<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Four seams</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>FRAMING · WHERE EACH ADAPTER SITS</span>
<span>03 / 13</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Four seams, one discipline</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Module A wraps a tool, B an assembler, C a provider, D a host. Each carries what it was given and decides nothing it should not.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="620" viewBox="0 0 1680 620" role="img" aria-label="A tool feeds adapter A, which produces the snapshot; the assembler behind protocol B renders the payload; provider adapter C sends it to the model's API. Host D spans all of it. Four cards state what each adapter keeps and what it never does.">
<defs>
<marker id="sm9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="20" width="200" height="100" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="20" y="64" font-size="19" fill="#11151B">your tool</text><text x="20" y="94" font-size="14" fill="#4A5361">retriever, table, MCP</text>
<rect x="236" y="20" width="220" height="100" fill="#2453C9"></rect><text x="256" y="64" font-size="24" font-weight="600" fill="#FFFFFF">A</text><text x="256" y="94" font-size="15" fill="#DCE3F5">tool to producer</text>
<rect x="492" y="20" width="200" height="100" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="512" y="64" font-size="19" fill="#11151B">snapshot</text><text x="512" y="94" font-size="14" fill="#4A5361">batches, route</text>
<rect x="728" y="20" width="220" height="100" fill="#2453C9"></rect><text x="748" y="64" font-size="24" font-weight="600" fill="#FFFFFF">B</text><text x="748" y="94" font-size="15" fill="#DCE3F5">assembler protocol</text>
<rect x="984" y="20" width="200" height="100" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="1004" y="64" font-size="19" fill="#11151B">payload</text><text x="1004" y="94" font-size="14" fill="#4A5361">and its trace</text>
<rect x="1220" y="20" width="220" height="100" fill="#2453C9"></rect><text x="1240" y="64" font-size="24" font-weight="600" fill="#FFFFFF">C</text><text x="1240" y="94" font-size="15" fill="#DCE3F5">provider adapter</text>
<rect x="1476" y="20" width="204" height="100" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="1496" y="64" font-size="19" fill="#11151B">model API</text><text x="1496" y="94" font-size="14" fill="#4A5361">a vendor's request</text>
<g stroke="#11151B" stroke-width="2">
<line x1="200" y1="70" x2="232" y2="70" marker-end="url(#sm9)"></line><line x1="456" y1="70" x2="488" y2="70" marker-end="url(#sm9)"></line>
<line x1="692" y1="70" x2="724" y2="70" marker-end="url(#sm9)"></line><line x1="948" y1="70" x2="980" y2="70" marker-end="url(#sm9)"></line>
<line x1="1184" y1="70" x2="1216" y2="70" marker-end="url(#sm9)"></line><line x1="1440" y1="70" x2="1472" y2="70" marker-end="url(#sm9)"></line>
</g>
<rect x="0" y="150" width="1680" height="70" fill="#FBF0EA" stroke="#C2541D" stroke-width="2"></rect>
<text x="20" y="194" font-size="24" font-weight="600" fill="#C2541D">D</text>
<text x="60" y="193" font-size="18" fill="#11151B">the host: its permission model says who may speak; producers read with read credentials before anything runs</text>
<g transform="translate(0,260)">
<rect x="0" y="0" width="404" height="340" fill="#FFFFFF" stroke="#2453C9" stroke-width="2"></rect>
<text x="24" y="42" font-size="18" font-weight="600" fill="#2453C9">A · KEEPS</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="80">provenance from the tool's</text><text x="24" y="106">own identifiers; scores passed</text><text x="24" y="132">through; suppressions reported</text></g>
<text x="24" y="210" font-size="18" font-weight="600" fill="#C2541D">NEVER</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="246">filters on a score, or invents</text><text x="24" y="272">a source the tool lacks</text></g>
</g>
<g transform="translate(424,260)">
<rect x="0" y="0" width="404" height="340" fill="#FFFFFF" stroke="#2453C9" stroke-width="2"></rect>
<text x="24" y="42" font-size="18" font-weight="600" fill="#2453C9">B · KEEPS</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="80">snapshot bytes on stdin;</text><text x="24" y="106">one JSON object on stdout;</text><text x="24" y="132">three exits a runner tells apart</text></g>
<text x="24" y="210" font-size="18" font-weight="600" fill="#C2541D">NEVER</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="246">anything else on stdout;</text><text x="24" y="272">a runner that imports it</text></g>
</g>
<g transform="translate(848,260)">
<rect x="0" y="0" width="404" height="340" fill="#FFFFFF" stroke="#2453C9" stroke-width="2"></rect>
<text x="24" y="42" font-size="18" font-weight="600" fill="#2453C9">C · KEEPS</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="80">every channel of the IR mapped</text><text x="24" y="106">onto the vendor's API; structure</text><text x="24" y="132">that adds no text</text></g>
<text x="24" y="210" font-size="18" font-weight="600" fill="#C2541D">NEVER</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="246">a preamble, a suffix,</text><text x="24" y="272">a reformatting</text></g>
</g>
<g transform="translate(1272,260)">
<rect x="0" y="0" width="408" height="340" fill="#FFFFFF" stroke="#C2541D" stroke-width="2"></rect>
<text x="24" y="42" font-size="18" font-weight="600" fill="#C2541D">D · KEEPS</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="80">permission as authority; the</text><text x="24" y="106">host's ids as sources; a handoff</text><text x="24" y="132">that adds no text</text></g>
<text x="24" y="210" font-size="18" font-weight="600" fill="#C2541D">NEVER</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="246">lets the wording decide</text><text x="24" y="272">who may instruct</text></g>
</g>
</g>
</svg>
</div>
</foreignObject>
</svg>

<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Four half days, each taught alone</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Every module runs in its own directory with uv and no model. The orange strip under a bar is that module's conference cut.</p>
</div>

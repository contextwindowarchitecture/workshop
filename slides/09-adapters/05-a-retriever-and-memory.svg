<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>A Retriever and memory</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>MODULE A · LABS 1 AND 2</span>
<span>05 / 13</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Pass it through; report what you drop</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">A retriever whose ranking surprises you, and a memory query that hides its own suppressions.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="Lab 1: the exports FAQ's copy outranks the data-export original; the route's exact dedupe keeps the copy and excludes the original as a duplicate. Lab 2: a SQL filter that drops expired and revoked rows; two traces with identical included lists, one reporting expired and revoked at stage producer and one reporting nothing.">
<g font-family="IBM Plex Mono, monospace">
<text x="0" y="22" font-size="17" font-weight="600" fill="#4A5361">LAB 1 · A RETRIEVER · 50 MIN</text>
<rect x="0" y="44" width="800" height="88" fill="#2453C9"></rect>
<text x="24" y="80" font-size="19" font-weight="600" fill="#FFFFFF">help:exports-faq@2#0</text>
<text x="24" y="112" font-size="15" fill="#DCE3F5">the FAQ's word-for-word copy · scored higher · kept</text>
<rect x="0" y="146" width="800" height="88" fill="#FFFFFF" stroke="#C2541D" stroke-width="2"></rect>
<text x="24" y="182" font-size="19" font-weight="600" fill="#11151B">help:data-export@6#0</text>
<text x="24" y="214" font-size="15" fill="#C2541D">the original · excluded · duplicate_of help:exports-faq@2#0</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="19" fill="#11151B">
<text x="0" y="284">The adapter passed the scores through; the route's dedupe: exact decided.</text>
<text x="0" y="312">The trace is right. A stale FAQ is what the model will cite: a finding</text>
<text x="0" y="340">about the help centre, visible because nothing was filtered on the way in.</text>
</g>
<rect x="0" y="390" width="800" height="230" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="24" y="430" font-size="16" font-weight="600" fill="#4A5361">CHECKPOINT 2 · WHICH COPY STAYED, AND WHY</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#9AA3B0">
<text x="24" y="474">How many hits, how many items, what was reported?</text><text x="24" y="504">Which identical chunk did the route keep, and by what rule?</text><text x="24" y="534">Without node metadata, which fields could the adapter not fill?</text><text x="24" y="564"></text><text x="24" y="594"></text>
</g>
<text x="880" y="22" font-size="17" font-weight="600" fill="#4A5361">LAB 2 · A MEMORY TABLE · 40 MIN</text>
<rect x="880" y="44" width="800" height="88" fill="#11151B"></rect>
<text x="904" y="84" font-size="18" fill="#FFFFFF">WHERE revoked_by IS NULL AND expires &gt; ?</text>
<text x="904" y="114" font-size="15" fill="#B9C3D6">the natural query, and the bug: rows gone before any Python</text>
<rect x="880" y="146" width="390" height="230" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="902" y="180" font-size="16" font-weight="600" fill="#2453C9">02 memory-reported</text>
<text x="902" y="214" font-size="15" fill="#4A5361">included</text>
<rect x="902" y="226" width="346" height="32" fill="#EEF1F8"></rect><text x="914" y="248" font-size="14" fill="#11151B">identical</text>
<text x="902" y="290" font-size="15" fill="#4A5361">excluded · stage producer</text>
<text x="902" y="322" font-size="15" fill="#C2541D">expired</text>
<text x="902" y="350" font-size="15" fill="#C2541D">revoked</text>
<rect x="1290" y="146" width="390" height="230" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="1312" y="180" font-size="16" font-weight="600" fill="#2453C9">03 memory-silent-fault</text>
<text x="1312" y="214" font-size="15" fill="#4A5361">included</text>
<rect x="1312" y="226" width="346" height="32" fill="#EEF1F8"></rect><text x="1324" y="248" font-size="14" fill="#11151B">identical</text>
<text x="1312" y="290" font-size="15" fill="#4A5361">excluded · stage producer</text>
<text x="1312" y="322" font-size="15" fill="#9AA3B0">nothing</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="19" fill="#11151B">
<text x="880" y="410">Nothing in the second trace is wrong, and nothing in it says two memories</text>
<text x="880" y="438">went missing. Admission cannot see this breach.</text>
</g>
<rect x="880" y="470" width="800" height="150" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="904" y="510" font-size="16" font-weight="600" fill="#4A5361">CHECKPOINT 3 · WHAT WOULD A REVIEWER READ?</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#9AA3B0">
<text x="904" y="552">The traces cannot show it. What can?</text><text x="904" y="582"></text>
</g>
</g>
</svg>
</div>
</foreignObject>
</svg>

<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>PART 4 · 10 MINUTES · THE GLOSSARY</span>
<span>07 / 10</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Six words, in your own words</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Look them up. Close the glossary. Write each in one line. Reopen it and mark what you missed.</p>
</div>
<svg width="1680" height="630" viewBox="0 0 1680 630" role="img" aria-label="Six terms: item, slot, snapshot, assembler, profile, trace">

<line x1="32" y1="256" x2="508" y2="256" stroke="{{c0.rule}}" stroke-width="1.5"></line>
<text x="32" y="284" font-family="IBM Plex Mono, monospace" font-size="16" fill="#C2541D">{{c0.tag}}</text>
</g>

<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const show = this.props.showAnswers ?? false;
    const words = [
      { word: 'item', a: ['One piece of candidate context:', 'a slot, an authority, a source', 'and a body.'], miss: false },
      { word: 'slot', a: ['One of eleven typed places,', 'grouped into four planes.', ''], miss: false },
      { word: 'snapshot', a: ['The frozen input to assembly,', 'taken before any model call,', 'clock and policy included.'], miss: true },
      { word: 'assembler', a: ['Turns a snapshot into a payload', 'and a trace. It never calls', 'a model.'], miss: true },
      { word: 'profile', a: ['Placement made explicit:', 'versioned, per route, evaluated,', 'recorded in every trace.'], miss: false },
      { word: 'trace', a: ['What was sent, and what was', 'left out, each exclusion with', 'a reason.'], miss: true }
    ];
    const cards = words.map((w, i) => {
      const x = (i % 3) * 570;
      const y = Math.floor(i / 3) * 330;
      const flag = show && w.miss;
      return {
        word: w.word,
        transform: 'translate(' + x + ',' + y + ')',
        l1: show ? w.a[0] : 'your definition',
        l2: show ? w.a[1] : '',
        l3: show ? w.a[2] : '',
        ink: show ? '#2E3540' : '#9AA3B0',
        rule: show ? '#DADFE7' : '#11151B',
        tag: flag ? 'a usual miss' : '',
        stroke: flag ? '#C2541D' : '#11151B',
        sw: flag ? 3 : 1.5
      };
    });
    return { c0: cards[0], c1: cards[1], c2: cards[2], c3: cards[3], c4: cards[4], c5: cards[5] };
  }
}
</script>

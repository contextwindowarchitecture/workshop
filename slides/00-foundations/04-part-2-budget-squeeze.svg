<div style="display: flex; flex-direction: column; gap: 26px; flex-grow: 1; font-size: 23px; line-height: 1.4">
<div style="display: flex; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">1</span><span><b>Budget squeeze.</b> 2k to 1k, then until it refuses.</span></div>
<div style="display: flex; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">2</span><span><b>Remove a slot.</b> Each in turn; the query last.</span></div>
<div style="display: flex; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">3</span><span><b>The bad panel.</b> One blob, no assembler. Find the imperative sentence in the retrieved text.</span></div>
<div style="display: flex; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">4</span><span><b>Planes.</b> Read the four questions.</span></div>
<div style="display: flex; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #4A5361">5</span><span style="color: #2E3540">Time left? The guided tour, sixteen stops.</span></div>
<div style="height: 2px; background: #DADFE7"></div>
<div style="font-size: 22px; color: #2E3540"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #11151B">Checkpoint 2</span> · for three failure modes, what the demo showed and which decision prevented it. Use its words: a slot, a tier, a reason, or "refused".</div>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Agenda</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>AGENDA · 3.5 HOURS INSTRUCTOR-LED</span>
<span>02 / 10</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Store the snapshot, not the prompt</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Clear the store before and after: <span style="font-family: 'IBM Plex Mono', monospace">rm -f store/cwa.sqlite</span>. Set <span style="font-family: 'IBM Plex Mono', monospace">CWA_W7_IMPL=labs</span> for the labs.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="400" viewBox="0 0 1680 400" role="img" aria-label="210 minute timeline: framing 10, part 1 20, lab B 40, break 15, lab C 60, break 10, lab D 30, close 25. Conference cut is part 1 and lab C.">

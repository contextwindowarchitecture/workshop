<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Lab D The outcomes table</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>LAB D · OUTCOMES.PY · R-12, R-17</span>
<span>08 / 10</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">What the host does with each refusal</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">The mapping a product owner signs off on, in one place. Change one you disagree with.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-label="Each refusal code and recovery action maps to a host action and an operator note">
<g font-family="IBM Plex Mono, monospace">
<g font-size="15" font-weight="600" fill="#4A5361">
<text x="0" y="22">REFUSAL · RECOVERY</text><text x="620" y="22">HOST ACTION</text><text x="980" y="22">OPERATOR NOTE</text>
</g>
<line x1="0" y1="38" x2="1680" y2="38" stroke="#11151B" stroke-width="2"></line>
<rect x="0" y="306" width="1680" height="48" fill="#FBF0EA" opacity="1"></rect>
<g font-size="17" fill="#11151B">
<text x="0" y="82">protected_content_over_budget</text>
<text x="0" y="146">slot_floor_over_budget</text>
<text x="0" y="210">evidence_required · request_context</text>
<text x="0" y="274">evidence_required · precompute_summary</text>
<text x="0" y="338">evidence_required · retrieve_narrower</text>
<text x="0" y="402">conflict_unresolved</text>
<text x="0" y="466">required_slot_missing</text>
<text x="0" y="530">protected_slot_unplaced</text>
</g>
<g font-size="17" font-weight="600">
<text x="620" y="82" fill="#2453C9">retry-larger-route</text>
<text x="620" y="146" fill="#2453C9">retry-larger-route</text>
<text x="620" y="210" fill="#11151B">needs-info</text>
<text x="620" y="274" fill="#2453C9">precompute-and-retry</text>
<text x="620" y="338" fill="#2453C9">precompute-and-retry</text>
<text x="620" y="402" fill="#C2541D">requires-manual-review</text>
<text x="620" y="466" fill="#C2541D">requires-manual-review</text>
<text x="620" y="530" fill="#C2541D">requires-manual-review</text>
</g>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#2E3540">
<text x="980" y="82">escalate to the large route; alert if that refuses too</text>
<text x="980" y="146">escalate; review the floor if it recurs</text>
<text x="980" y="210">nothing retrievable; no retry</text>
<text x="980" y="274">an evidence item had no variant; queue summarisation, retry once</text>
<text x="980" y="338">evidence was shed for budget; retry with a narrower query</text>
<text x="980" y="402">open a ticket with the conflict groups from the trace</text>
<text x="980" y="466">an application bug: a required producer emitted nothing</text>
<text x="980" y="530">a profile bug: a protected slot has no placement</text>
</g>
<g stroke="#DADFE7" stroke-width="1.5">
<line x1="0" y1="106" x2="1680" y2="106"></line><line x1="0" y1="170" x2="1680" y2="170"></line><line x1="0" y1="234" x2="1680" y2="234"></line>
<line x1="0" y1="298" x2="1680" y2="298"></line><line x1="0" y1="362" x2="1680" y2="362"></line><line x1="0" y1="426" x2="1680" y2="426"></line>
<line x1="0" y1="490" x2="1680" y2="490"></line>
</g>
<text x="0" y="586" font-size="15" fill="#4A5361">Most often changed: retrieve_narrower, which some teams send to the user as needs-info rather than retry silently.</text>
</g>
</svg>
</div>
</foreignObject>
</svg>

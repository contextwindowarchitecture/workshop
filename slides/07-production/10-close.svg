<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Close</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>CLOSE · 25 MINUTES · THE PLAYBOOK ON ONE PAGE</span>
<span>10 / 10</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Store, emit, gate, outcome</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Tick what your system has today.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="460" viewBox="0 0 1680 460" role="img" aria-label="Four playbook columns with an empty box to tick for each">
<g font-family="IBM Plex Mono, monospace">
<g>
<rect x="0" y="0" width="400" height="460" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<rect x="28" y="28" width="40" height="40" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="88" y="58" font-size="26" font-weight="600" fill="#2453C9">store</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="28" y="130">every snapshot, by digest</text>
<text x="28" y="166">with the run, trace and calls</text>
<text x="28" y="202">replayable without a model</text>
<text x="28" y="238">what-if before shipping</text>
</g>
</g>
<g transform="translate(426,0)">
<rect x="0" y="0" width="400" height="460" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<rect x="28" y="28" width="40" height="40" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="88" y="58" font-size="26" font-weight="600" fill="#2453C9">emit</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="28" y="130">a span per run, inference</text>
<text x="28" y="166">and tool call</text>
<text x="28" y="202">decisions and digests</text>
<text x="28" y="238">no content, tested</text>
</g>
</g>
<g transform="translate(852,0)">
<rect x="0" y="0" width="400" height="460" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<rect x="28" y="28" width="40" height="40" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="88" y="58" font-size="26" font-weight="600" fill="#2453C9">gate</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="28" y="130">policy and profile from</text>
<text x="28" y="166">a registry lock</text>
<text x="28" y="202">evaluated live, for the</text>
<text x="28" y="238">model that runs it</text>
</g>
</g>
<g transform="translate(1278,0)">
<rect x="0" y="0" width="402" height="460" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<rect x="28" y="28" width="40" height="40" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="88" y="58" font-size="26" font-weight="600" fill="#2453C9">outcome</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="28" y="130">every refusal mapped to</text>
<text x="28" y="166">what the user sees, what</text>
<text x="28" y="202">retries, and what goes to</text>
<text x="28" y="238">a person</text>
</g>
</g>
</g>
</svg>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; font-size: 23px; line-height: 1.45">
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">Today</span><span>Add the snapshot digest and the refusal reason to your dashboards: the two attributes that make a CWA incident debuggable.</span></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #2453C9">Next</span><span>The first capstone applies all of W2 to W7 to a new domain.</span></div>
</div>
</div>
</foreignObject>
</svg>

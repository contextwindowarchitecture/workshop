<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>W3a Integrating CWA into an existing application</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 96px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>CONTEXT WINDOW ARCHITECTURE · WORKSHOP 3A</span>
<span>01 / 12</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 80px">
<div style="display: flex; flex-direction: column; gap: 36px; max-width: 980px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; color: #2453C9; font-weight: 500">W3a · Integration</div>
<h1 style="margin: 0; font-size: 116px; line-height: 0.98; font-weight: 700; letter-spacing: -0.03em">Integrating CWA into an existing application</h1>
<p style="margin: 0; font-size: 30px; line-height: 1.45; color: #4A5361; max-width: 900px">Every model call frozen into a snapshot, decided by the assembler, explained by a trace, handed to the provider unchanged, and checked by guards that do not care how the model was asked.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" role="img" aria-label="Producers, snapshot, assembler, payload and trace, provider unchanged, guards on the reply">
<defs>
<marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="60" y="0" width="480" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="84" y="40" font-size="20" fill="#11151B">producers · facts</text>
<line x1="300" y1="64" x2="300" y2="96" stroke="#11151B" stroke-width="2" marker-end="url(#m3)"></line>
<rect x="60" y="104" width="480" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="84" y="144" font-size="20" fill="#11151B">snapshot, frozen once</text>
<line x1="300" y1="168" x2="300" y2="200" stroke="#11151B" stroke-width="2" marker-end="url(#m3)"></line>
<rect x="60" y="208" width="480" height="64" fill="#2453C9"></rect>
<text x="84" y="248" font-size="20" font-weight="600" fill="#FFFFFF">assembler</text>
<line x1="200" y1="272" x2="200" y2="304" stroke="#11151B" stroke-width="2" marker-end="url(#m3)"></line>
<line x1="420" y1="272" x2="420" y2="304" stroke="#11151B" stroke-width="2" marker-end="url(#m3)"></line>
<rect x="60" y="312" width="280" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="84" y="352" font-size="20" fill="#11151B">payload</text>
<rect x="360" y="312" width="180" height="64" fill="#11151B"></rect>
<text x="384" y="352" font-size="20" fill="#FFFFFF">trace</text>
<line x1="200" y1="376" x2="200" y2="408" stroke="#11151B" stroke-width="2" marker-end="url(#m3)"></line>
<rect x="60" y="416" width="280" height="64" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="84" y="446" font-size="20" fill="#11151B">provider</text>
<text x="84" y="468" font-size="14" fill="#4A5361">unchanged, no text of its own</text>
<line x1="200" y1="480" x2="200" y2="512" stroke="#11151B" stroke-width="2" marker-end="url(#m3)"></line>
<rect x="60" y="520" width="480" height="64" fill="#C2541D"></rect>
<text x="84" y="560" font-size="20" font-weight="600" fill="#FFFFFF">guards on the reply</text>
</g>
</svg>
</div>
<div style="display: flex; gap: 48px; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #2E3540">
<span>A full day</span>
<span style="color: #9AA3B0">/</span>
<span>Self-paced, model-free</span>
<span style="color: #9AA3B0">/</span>
<span>After W1 and W2</span>

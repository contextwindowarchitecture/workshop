<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Step 6 Guards</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>STEP 6 · 45 MINUTES · GUARDS.PY · R-5</span>
<span>11 / 12</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Move enforcement out of the prompt</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">The "never" sentences stay in the instructions as guidance. Two guards on the reply enforce them.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="560" viewBox="0 0 1680 560" role="img" aria-label="The model's reply passes through answer(), where a price guard and a workspace guard run before anything reaches the user; a failing reply is withheld.">
<defs>
<marker id="gd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="150" width="240" height="100" fill="#FFFFFF" stroke="#11151B" stroke-width="2" stroke-dasharray="8 6"></rect>
<text x="24" y="196" font-size="20" font-weight="600" fill="#11151B">model</text>
<text x="24" y="224" font-size="15" fill="#4A5361">however it was asked</text>
<line x1="240" y1="200" x2="330" y2="200" stroke="#11151B" stroke-width="2" marker-end="url(#gd)"></line>
<text x="254" y="186" font-size="15" fill="#4A5361">reply</text>
<rect x="340" y="40" width="860" height="320" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="364" y="80" font-size="20" font-weight="600" fill="#11151B">answer() in after/app.py</text>
<rect x="364" y="110" width="390" height="220" fill="#C2541D"></rect>
<text x="386" y="150" font-size="20" font-weight="600" fill="#FFFFFF">price guard</text>
<text x="386" y="186" font-size="16" fill="#FFFFFF">amounts in the reply</text>
<text x="386" y="210" font-size="16" fill="#FFFFFF">against the evidence sent</text>
<text x="386" y="268" font-size="16" fill="#FFFFFF">"$24" when only "$12"</text>
<text x="386" y="292" font-size="16" fill="#FFFFFF">was sent: blocked</text>
<rect x="786" y="110" width="390" height="220" fill="#C2541D"></rect>
<text x="808" y="150" font-size="20" font-weight="600" fill="#FFFFFF">workspace guard</text>
<text x="808" y="186" font-size="16" fill="#FFFFFF">another workspace's name</text>
<text x="808" y="210" font-size="16" fill="#FFFFFF">in the reply</text>
<text x="808" y="268" font-size="16" fill="#FFFFFF">"Larkspur Design" for</text>
<text x="808" y="292" font-size="16" fill="#FFFFFF">Ada: blocked</text>
<path d="M 1200 150 L 1300 150" fill="none" stroke="#11151B" stroke-width="2" marker-end="url(#gd)"></path>
<text x="1214" y="138" font-size="15" fill="#4A5361">pass</text>
<rect x="1310" y="100" width="370" height="100" fill="#2453C9"></rect>
<text x="1334" y="158" font-size="20" font-weight="600" fill="#FFFFFF">to the user</text>
<path d="M 1200 270 L 1300 270" fill="none" stroke="#11151B" stroke-width="2" marker-end="url(#gd)"></path>
<text x="1214" y="258" font-size="15" fill="#4A5361">fail</text>
<rect x="1310" y="220" width="370" height="100" fill="#FFFFFF" stroke="#C2541D" stroke-width="3"></rect>
<text x="1334" y="278" font-size="20" font-weight="600" fill="#C2541D">withheld</text>
</g>
<g font-family="IBM Plex Sans, sans-serif">
<text x="0" y="440" font-size="30" font-weight="700" fill="#11151B">The price guard is a regex.</text>
<text x="0" y="486" font-size="26" fill="#2E3540">The lesson is where it runs, not what it matches: outside the model, where no wording reaches it.</text>
</g>
</svg>
</div>
</foreignObject>
</svg>

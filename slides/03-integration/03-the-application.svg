<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>The application</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>THE APPLICATION · FERNWAY ACCOUNT ASSISTANT</span>
<span>03 / 12</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">As teams usually write it, and your copy</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Read <span style="font-family: 'IBM Plex Mono', monospace">before/README.md</span> with W0's seven failure modes beside you.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="620" viewBox="0 0 1680 620" role="img" aria-label="before/app.py pastes instructions, the account line, every memory, the five best paragraphs and the last six messages into one request. after/ starts identical plus stubs for producers.py, context.py, guards.py and policy/.">
<defs>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="800" height="620" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="32" y="54" font-size="28" font-weight="600" fill="#11151B">before/app.py</text>
<text x="32" y="88" font-size="16" fill="#4A5361">frozen; tests/test_before.py asserts its failure modes</text>
<g font-size="17" fill="#11151B">
<rect x="32" y="130" width="300" height="52" fill="#F4F5F7" stroke="#7A8494"></rect><text x="50" y="162">the instructions</text>
<rect x="32" y="196" width="300" height="52" fill="#F4F5F7" stroke="#7A8494"></rect><text x="50" y="228">the account line</text>
<rect x="32" y="262" width="300" height="52" fill="#F4F5F7" stroke="#C2541D" stroke-width="2"></rect><text x="50" y="294">every memory on file</text>
<rect x="32" y="328" width="300" height="52" fill="#F4F5F7" stroke="#7A8494"></rect><text x="50" y="360">five best paragraphs</text>
<rect x="32" y="394" width="300" height="52" fill="#F4F5F7" stroke="#7A8494"></rect><text x="50" y="426">last six messages</text>
</g>
<g stroke="#11151B" stroke-width="2" fill="none">
<path d="M 332 156 C 400 156, 400 288, 460 288"></path>
<path d="M 332 222 C 400 222, 400 288, 460 288"></path>
<path d="M 332 288 L 460 288"></path>
<path d="M 332 354 C 400 354, 400 288, 460 288"></path>
<path d="M 332 420 C 400 420, 400 288, 460 288"></path>
</g>
<line x1="460" y1="288" x2="500" y2="288" stroke="#11151B" stroke-width="2" marker-end="url(#ap)"></line>
<rect x="510" y="228" width="258" height="120" fill="#DADFE7"></rect>
<text x="530" y="280" font-size="20" font-weight="600" fill="#11151B">one request</text>
<text x="530" y="310" font-size="15" fill="#2E3540">pasted, then sent</text>
<text x="32" y="510" font-size="17" fill="#2E3540" font-family="IBM Plex Sans, sans-serif">One function. Each of W0's failure modes has a line in it;</text>
<text x="32" y="538" font-size="17" fill="#2E3540" font-family="IBM Plex Sans, sans-serif">the table in before/README.md says which.</text>
<rect x="880" y="0" width="800" height="620" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="912" y="54" font-size="28" font-weight="600" fill="#2453C9">after/</text>
<text x="912" y="88" font-size="16" fill="#4A5361">your copy: identical, plus stubs</text>
<g font-size="19">
<rect x="912" y="130" width="340" height="56" fill="#EEF1F8" stroke="#2453C9" stroke-width="1.5"></rect><text x="932" y="165" fill="#11151B">producers.py</text>
<text x="1272" y="165" font-size="16" fill="#2E3540">who proposes what</text>
<rect x="912" y="200" width="340" height="56" fill="#EEF1F8" stroke="#2453C9" stroke-width="1.5"></rect><text x="932" y="235" fill="#11151B">context.py</text>
<text x="1272" y="235" font-size="16" fill="#2E3540">snapshot, groups, budget</text>
<rect x="912" y="270" width="340" height="56" fill="#EEF1F8" stroke="#2453C9" stroke-width="1.5"></rect><text x="932" y="305" fill="#11151B">policy/</text>
<text x="1272" y="305" font-size="16" fill="#2E3540">route, profile, assembly</text>
<rect x="912" y="340" width="340" height="56" fill="#FBF0EA" stroke="#C2541D" stroke-width="1.5"></rect><text x="932" y="375" fill="#11151B">guards.py</text>
<text x="1272" y="375" font-size="16" fill="#2E3540">checks on the reply</text>
</g>
<line x1="912" y1="430" x2="1648" y2="430" stroke="#DADFE7" stroke-width="2"></line>
<text x="912" y="476" font-size="18" fill="#11151B">solution/</text>
<text x="1060" y="476" font-size="16" fill="#2E3540">the finished migration, read when stuck</text>
<text x="912" y="516" font-size="18" fill="#11151B">provider.py</text>
<text x="1060" y="516" font-size="16" fill="#2E3540">the OpenAI-compatible last mile</text>
<text x="912" y="572" font-size="15" fill="#4A5361">No model needed. With OPENAI_BASE_URL set, both apps send for real.</text>
</g>
</svg>
</div>
</foreignObject>
</svg>

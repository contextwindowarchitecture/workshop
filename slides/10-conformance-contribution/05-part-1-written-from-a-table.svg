<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Part 1 Written from a table</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>PART 1 · CONFORMANCE/GENERATORS/</span>
<span>05 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Written from a table, never from a run</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">The cases that matter most have generators. Each case is a table of what the rules intend.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="A generator's table lists candidates with their producer and groups with the decision each intends. The expected trace and payload are derived from it. Running an assembler and pasting its output is never how a case is made, because such a case cannot fail the assembler that produced it. The only computed value is the snapshot digest.">
<defs>
<marker id="tb10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
<marker id="tb10o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2541D"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="700" height="360" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<rect x="0" y="0" width="700" height="56" fill="#2453C9"></rect>
<text x="24" y="36" font-size="19" font-weight="600" fill="#FFFFFF">TABLE</text>
<text x="24" y="98" font-size="16" font-weight="600" fill="#11151B">candidates</text>
<text x="24" y="126" font-size="15" fill="#4A5361">each with its producer</text>
<line x1="24" y1="150" x2="676" y2="150" stroke="#DADFE7" stroke-width="2"></line>
<text x="24" y="188" font-size="16" font-weight="600" fill="#11151B">groups, each with the decision it intends</text>
<g font-size="15" fill="#2453C9"><text x="24" y="224">decided_by</text><text x="200" y="224">resolution</text><text x="376" y="224">winner</text><text x="24" y="254">the members excluded</text></g>
<line x1="24" y1="280" x2="676" y2="280" stroke="#DADFE7" stroke-width="2"></line>
<text x="24" y="318" font-size="15" fill="#4A5361">the route's policy for the group</text>
<line x1="700" y1="180" x2="836" y2="180" stroke="#11151B" stroke-width="2" marker-end="url(#tb10)"></line>
<text x="716" y="166" font-size="15" fill="#11151B">derived</text>
<rect x="840" y="40" width="840" height="120" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="864" y="84" font-size="19" font-weight="600" fill="#11151B">expected.trace.json</text>
<text x="864" y="120" font-size="15" fill="#4A5361">written field by field, in the order R-21 lists them</text>
<rect x="840" y="200" width="840" height="120" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="864" y="244" font-size="19" font-weight="600" fill="#11151B">expected.payload.txt</text>
<text x="864" y="280" font-size="15" fill="#4A5361">or none, when the table intends a refusal</text>
<text x="0" y="408" font-size="16" fill="#2E3540">The generator checks only that the table is self-consistent with the rules in conformance/README.md.</text>
<rect x="0" y="448" width="820" height="172" fill="#FBF0EA" stroke="#C2541D" stroke-width="2"></rect>
<text x="24" y="488" font-size="17" font-weight="600" fill="#C2541D">NEVER</text>
<text x="24" y="526" font-size="17" fill="#11151B">run an assembler</text>
<line x1="210" y1="520" x2="320" y2="520" stroke="#C2541D" stroke-width="2" marker-end="url(#tb10o)"></line>
<text x="330" y="526" font-size="17" fill="#11151B">paste the expected trace</text>
<line x1="20" y1="520" x2="600" y2="520" stroke="#C2541D" stroke-width="3"></line>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B"><text x="24" y="572">A case produced that way cannot fail the</text><text x="24" y="598">assembler that produced it.</text></g>
<rect x="860" y="448" width="820" height="172" fill="#11151B"></rect>
<text x="884" y="488" font-size="17" font-weight="600" fill="#B9C3D6">THE ONLY COMPUTED VALUE</text>
<text x="884" y="528" font-size="18" fill="#FFFFFF">context.snapshot_digest</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#B9C3D6"><text x="884" y="568">SHA-256 over the RFC 8785 serialization of the</text><text x="884" y="594">normalized snapshot; the generators ship digest.py</text></g>
</g>
</svg>
</div>
</foreignObject>
</svg>

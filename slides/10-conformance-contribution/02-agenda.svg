<p style="margin: 0; font-size: 28px; color: #2E3540">Labs A and C run here alone. Lab B's checker needs the <span style="font-family: 'IBM Plex Mono', monospace">contextwindowarchitecture</span> sibling.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="400" viewBox="0 0 1680 400" role="img" aria-label="240 minute timeline: framing 10, part 1 30, part 2 30, break 10, lab A 75, lab B 30, lab C 45, close 10. Conference cut is parts 1 and 2, 60 minutes.">

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab A Your case</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453C9}a:hover{color:#1A3D96}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>PART 3 · LAB A · 75 MINUTES</span>
<span>07 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Your case: three things must hold</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Pick a defect from W8's manifest or <span style="font-family: 'IBM Plex Mono', monospace">uncovered.json</span>, and read the rule it breaks before you write a row.</p>
</div>
<svg width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="Commands to copy the template, generate the case and verify it. Three things must hold: the reference passes, your defect fails, most other defects do not. Then three changes to the table to try. Checkpoint 3 lists good first picks.">
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="1680" height="104" fill="#11151B"></rect>
<text x="24" y="40" font-size="16" fill="#FFFFFF">cp template.py my_case.py   # set DEFAULT_ID; uv run my_case.py</text>
<text x="24" y="76" font-size="16" fill="#FFFFFF">uv run verify.py --case &lt;id&gt; --defect &lt;defect&gt;   ·   uv run verify.py --case &lt;id&gt; --all-defects</text>
<g transform="translate(0,136)">
<rect x="0" y="0" width="540" height="200" fill="#11151B"></rect>
<text x="24" y="44" font-size="20" font-weight="600" fill="#FFFFFF">the reference passes</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#B9C3D6"><text x="24" y="90">your table says what the</text><text x="24" y="116">rules say</text></g>
</g>
<g transform="translate(570,136)">
<rect x="0" y="0" width="540" height="200" fill="#C2541D"></rect>
<text x="24" y="44" font-size="20" font-weight="600" fill="#FFFFFF">your defect fails</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#FFFFFF"><text x="24" y="90">the case reaches the line</text><text x="24" y="116">the defect changes</text></g>
</g>
<g transform="translate(1140,136)">
<rect x="0" y="0" width="540" height="200" fill="#2453C9"></rect>
<text x="24" y="44" font-size="20" font-weight="600" fill="#FFFFFF">most others do not</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#FFFFFF"><text x="24" y="90">the case is about one thing</text></g>
</g>
<text x="0" y="380" font-size="15" fill="#4A5361">the reference fails yours? the case is wrong, or it is a finding: read the trace before deciding which</text>
<text x="0" y="440" font-size="17" font-weight="600" fill="#4A5361">THEN CHANGE THE TABLE</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="0" y="480">flip the one condition the defect turns on;</text>
<text x="0" y="506">watch which fields of the expected trace follow</text>
<text x="0" y="550">make two items agree; watch the case stop isolating</text>
<text x="0" y="594">change the route's on_unresolved; see what else moves</text>
</g>
<rect x="840" y="420" width="840" height="200" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="864" y="458" font-size="16" font-weight="600" fill="#4A5361">CHECKPOINT 3 · DEFECT, RULE, FIELD, COUNT</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="{{ink}}">
<text x="864" y="496">{{c1}}</text><text x="864" y="522">{{c2}}</text><text x="864" y="548">{{c3}}</text><text x="864" y="574">{{c4}}</text><text x="864" y="600">{{c5}}</text>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.showAnswers ?? false;
    return {
      ink: s ? '#11151B' : '#9AA3B0',
      c1: s ? 'Good first picks: threshold-is-strict (one item at exactly' : 'Your defect, the rule it breaks,',
      c2: s ? 'min_relevance), expired-is-exclusive (a memory item expiring at the' : 'the first differing field,',
      c3: s ? 'assembly instant), history-renders-by-id (id and time order disagree).' : 'and the count from --all-defects.',
      c4: s ? 'Harder: strings-order-by-utf8 (an id outside the BMP),' : '',
      c5: s ? 'margin-rounds-down (a budget at the rounding edge).' : ''
    };
  }
}
</script>
</body>
</html>

<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Three kinds of issue, one kind of pull request</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Questions go to Discussions. A change to what a requirement means is agreed in an issue before a diff.</p>
</div>
<svg width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="Three issue templates: a problem with a conformance case, a change to the specification, an implementation to list, each with what it is for and what it asks. Below, what a pull request needs.">
<g font-family="IBM Plex Mono, monospace">
<g>
<rect x="0" y="0" width="540" height="330" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="24" y="42" font-size="18" font-weight="600" fill="#11151B">a problem with a</text><text x="24" y="66" font-size="18" font-weight="600" fill="#11151B">conformance case</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#2E3540"><text x="24" y="110">a case whose expectation looks</text><text x="24" y="134">wrong, or that two implementations</text><text x="24" y="158">read differently</text></g>
<text x="24" y="210" font-size="14" font-weight="600" fill="#2453C9">ASKS FOR</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#11151B"><text x="24" y="242">the case; what it expects and what</text><text x="24" y="266">it should, citing the rule that</text><text x="24" y="290">decides</text></g>
</g>
<g>
<rect x="570" y="0" width="540" height="330" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="594" y="42" font-size="18" font-weight="600" fill="#2453C9">a change to the</text><text x="594" y="66" font-size="18" font-weight="600" fill="#2453C9">specification</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#2E3540"><text x="594" y="110">SPEC.md, a schema, the contract</text><text x="594" y="134">data or conformance/README.md</text></g>
<text x="594" y="210" font-size="14" font-weight="600" fill="#2453C9">ASKS FOR</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#11151B"><text x="594" y="242">what should change, naming R-n or the</text><text x="594" y="266">section and what it says now; why,</text><text x="594" y="290">with a snapshot or trace that shows it</text></g>
</g>
<g>
<rect x="1140" y="0" width="540" height="330" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="1164" y="42" font-size="18" font-weight="600" fill="#11151B">an implementation</text><text x="1164" y="66" font-size="18" font-weight="600" fill="#11151B">to list</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#2E3540"><text x="1164" y="110">help listing an assembler</text></g>
<text x="1164" y="210" font-size="14" font-weight="600" fill="#2453C9">ASKS FOR</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#11151B"><text x="1164" y="242">the repository; what you need</text></g>
</g>
<rect x="0" y="370" width="1680" height="250" fill="#11151B"></rect>
<text x="24" y="412" font-size="17" font-weight="600" fill="#B9C3D6">A PULL REQUEST NEEDS</text>

<text x="24" y="460">the checks green</text>
<text x="24" y="500">derived text regenerated, not edited</text>
<text x="24" y="540">cases regenerated from their generators</text>
<text x="860" y="460">a CHANGES.md bullet, a new case included</text>
<text x="860" y="500">Signed-off-by on every commit: git commit -s</text>
</g>
<text x="24" y="592" font-size="15" fill="#B9C3D6">maintainers squash-merge</text>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part 2 The worked example</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453C9}a:hover{color:#1A3D96}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>PART 2 · 30 MINUTES · CONFLICT-TIEBREAK-NOT-PERMITTED</span>
<span>06 / 11</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">A case must fail its defect, and only its defect</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">The reference passes, the defective copy fails, and the other defects mostly do not trip it.</p>
</div>
<svg width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="generate.py's table intends an escalated, refused group. verify.py: the reference passes; the copy with tiebreak-without-permission resolves by freshness, excludes kb:window-1 and assembles 33 tokens. Checkpoint 2 asks for the first differing field and the count across eleven defects.">
<defs>
<marker id="ex10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="1680" height="64" fill="#11151B"></rect>
<text x="24" y="40" font-size="17" fill="#FFFFFF">uv run generate.py · uv run verify.py · uv run verify.py --all-defects · uv run pytest</text>
<rect x="0" y="96" width="520" height="524" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="24" y="136" font-size="17" font-weight="600" fill="#2453C9">GENERATE.PY · TABLE</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="24" y="180">one fact group</text>
<text x="24" y="206">two leaders from the top-ranked</text>
<text x="24" y="232">producer, at different instants</text>
<text x="24" y="276">a fact policy with precedence,</text>
<text x="24" y="302">no freshness_tiebreak</text>
<text x="24" y="346">on_unresolved: refuse</text>
</g>
<text x="24" y="408" font-size="16" font-weight="600" fill="#4A5361">INTENDS</text>
<g font-size="17" fill="#2453C9"><text x="24" y="446">decided_by: escalated</text><text x="24" y="478">resolution: refused</text><text x="24" y="510">refusal: conflict_unresolved</text></g>
<text x="24" y="572" font-size="14" fill="#4A5361">so no expected.payload.txt</text>
<line x1="520" y1="300" x2="576" y2="300" stroke="#11151B" stroke-width="2" marker-end="url(#ex10)"></line>
<text x="580" y="128" font-size="17" font-weight="600" fill="#4A5361">VERIFY.PY</text>
<rect x="580" y="148" width="560" height="120" fill="#11151B"></rect>
<text x="604" y="192" font-size="19" font-weight="600" fill="#FFFFFF">the reference</text>
<text x="604" y="230" font-size="16" fill="#B9C3D6">must pass: the table says what the rules say</text>
<rect x="580" y="292" width="560" height="328" fill="#FBF0EA" stroke="#C2541D" stroke-width="2"></rect>
<text x="604" y="334" font-size="19" font-weight="600" fill="#C2541D">a copy with one defect</text>
<text x="604" y="364" font-size="15" fill="#11151B">tiebreak-without-permission</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#11151B">
<text x="604" y="414">resolves the group</text>
<text x="604" y="440">decided_by: freshness</text>
<text x="604" y="484">excludes kb:window-1</text>
<text x="604" y="510">with conflict_lost</text>
<text x="604" y="554">assembles 33 tokens where</text>
<text x="604" y="580">the case expects a refusal</text>
</g>
<rect x="1180" y="96" width="500" height="524" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="1204" y="136" font-size="17" font-weight="600" fill="#4A5361">CHECKPOINT 2</text>
<text x="1204" y="186" font-size="16" fill="#11151B">the first differing field</text>
<rect x="1204" y="204" width="452" height="60" fill="#EEF1F8"></rect>
<text x="1224" y="242" font-size="19" fill="{{ink}}">{{f}}</text>
<text x="1204" y="318" font-size="16" fill="#11151B">--all-defects: how many of</text>
<text x="1204" y="342" font-size="16" fill="#11151B">W8's eleven it catches</text>
<rect x="1204" y="360" width="452" height="60" fill="#EEF1F8"></rect>
<text x="1224" y="398" font-size="19" fill="{{ink}}">{{n}}</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#2E3540">
<text x="1204" y="480">A case every defect trips is</text>
<text x="1204" y="506">testing nothing in particular.</text>
<text x="1204" y="548">Specific is the second thing</text>
<text x="1204" y="574">a case must be.</text>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.showAnswers ?? false;
    return {
      ink: s ? '#11151B' : '#9AA3B0',
      f: s ? '/conflicts/0/decided_by' : 'which pointer?',
      n: s ? '1 of 11' : '? of 11'
    };
  }
}
</script>
</body>
</html>

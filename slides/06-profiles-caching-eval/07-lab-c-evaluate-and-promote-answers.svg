<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Lab C Evaluate and promote</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>LAB C · 60 MINUTES · EVALUATE.PY · R-19</span>
<span>07 / 09</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Evaluate, then promote for a model</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">A profile is evaluated for a model family, not in the abstract.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-label="The suite runs a profile and writes an artifact; promote writes the evaluation object into the profile with the model family. The structural suite is model-free; the live part asks a model and grades its citations.">
<defs>
<marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="500" height="330" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="24" y="42" font-size="20" font-weight="600" fill="#11151B">w6-structural/v1</text>
<text x="24" y="74" font-size="15" fill="#4A5361">three frozen conversations</text>
<g font-size="16" fill="#11151B">
<text x="24" y="116">block reuse</text><text x="24" y="144">byte reuse</text><text x="24" y="172">evidence distance</text><text x="24" y="200">tokens</text>
</g>
<text x="24" y="234" font-size="15" fill="#2453C9">deterministic, model-free</text>
<line x1="24" y1="254" x2="476" y2="254" stroke="#DADFE7" stroke-width="1.5"></line>
<text x="24" y="284" font-size="16" fill="#C2541D" font-weight="600">--live</text>
<text x="24" y="310" font-size="14" fill="#2E3540">does the answer cite only articles sent?</text>
<line x1="500" y1="165" x2="580" y2="165" stroke="#11151B" stroke-width="2" marker-end="url(#pm)"></line>
<text x="510" y="150" font-size="14" fill="#4A5361">run</text>
<rect x="590" y="40" width="500" height="250" fill="#11151B"></rect>
<text x="614" y="82" font-size="19" font-weight="600" fill="#FFFFFF">artifact · evaluations/</text>
<g font-size="16" fill="#B9C3D6">
<text x="614" y="124">suite · profile · date</text><text x="614" y="154">result</text><text x="614" y="184">live answers, when it ran</text>
</g>
<text x="614" y="250" font-size="15" fill="#F0A57E">cache-first-v1-w6-structural-v1.json</text>
<line x1="1090" y1="165" x2="1170" y2="165" stroke="#11151B" stroke-width="2" marker-end="url(#pm)"></line>
<text x="1094" y="150" font-size="14" fill="#4A5361">promote</text>
<rect x="1180" y="0" width="500" height="330" fill="#2453C9"></rect>
<text x="1204" y="42" font-size="20" font-weight="600" fill="#FFFFFF">the profile, next version</text>
<text x="1204" y="84" font-size="16" fill="#FFFFFF">evaluation object:</text>
<g font-size="16" fill="#DCE3F5">
<text x="1220" y="116">suite · date · result</text><text x="1220" y="144">artifact path</text>
</g>
<text x="1204" y="192" font-size="16" fill="#FFFFFF">model_family:</text>
<text x="1220" y="220" font-size="16" fill="#DCE3F5">--model-family &lt;your model&gt;</text>
<text x="1220" y="250" font-size="14" fill="#DCE3F5">a new model target: version + 1 (R-20)</text>
<text x="1204" y="290" font-size="14" fill="#FFFFFF">no model family: refused (R-19)</text>
</g>
<g font-family="IBM Plex Sans, sans-serif">
<rect x="0" y="380" width="1680" height="100" fill="#FBF0EA" stroke="#C2541D" stroke-width="2"></rect>
<text x="24" y="422" font-size="21" font-weight="700" fill="#11151B">The structural suite is enough to practise the mechanism, not to call a profile evaluated for a model.</text>
<text x="24" y="456" font-size="18" fill="#2E3540">The solution's artifact says so plainly: <tspan font-family="IBM Plex Mono, monospace" fill="#C2541D">live.ran: false</tspan>. With an endpoint, run <tspan font-family="IBM Plex Mono, monospace">--live</tspan> and promote on that.</text>
<text x="0" y="530" font-size="17" fill="#4A5361">CHECKPOINT 3 · what would the live part add?</text>
<text x="0" y="562" font-size="18" font-weight="600" fill="#11151B">Whether answers are grounded and correct for that model, with the articles that far from the instructions.</text>
</g>
</svg>
</div>
</foreignObject>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab D Lock and gate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453C9}a:hover{color:#1A3D96}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>LAB D · 30 MINUTES · REGISTRY.PY · R-19, R-20</span>
<span>08 / 09</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Lock the registry, gate the deployment</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Then do the thing the lock exists for: tamper, and read the refusal.</p>
</div>
<svg width="1680" height="600" viewBox="0 0 1680 600" role="img" aria-label="A profile's digest covers everything but its evaluation object. The lock pins every profile and the route policy by digest. A deployment gets only an evaluated profile; editing a placement without bumping the version is refused.">
<defs>
<marker id="rg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="0" width="500" height="260" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect>
<text x="24" y="42" font-size="20" font-weight="600" fill="#11151B">a profile's digest</text>
<rect x="24" y="66" width="452" height="110" fill="#2453C9"></rect>
<text x="44" y="104" font-size="16" fill="#FFFFFF">id · version · placement</text>
<text x="44" y="132" font-size="16" fill="#FFFFFF">everything else</text>
<text x="44" y="158" font-size="14" fill="#DCE3F5">covered by the digest</text>
<rect x="24" y="186" width="452" height="50" fill="#FFFFFF" stroke="#9AA3B0" stroke-dasharray="6 5"></rect>
<text x="44" y="217" font-size="16" fill="#4A5361">evaluation object: not covered</text>
<line x1="500" y1="130" x2="580" y2="130" stroke="#11151B" stroke-width="2" marker-end="url(#rg)"></line>
<rect x="590" y="0" width="500" height="260" fill="#11151B"></rect>
<text x="614" y="42" font-size="20" font-weight="600" fill="#FFFFFF">registry.lock.json</text>
<g font-size="16" fill="#B9C3D6">
<text x="614" y="90">pins every profile and</text><text x="614" y="116">the route policy by digest</text>
<text x="614" y="164">never rewrites an entry</text>
</g>
<text x="614" y="226" font-size="15" fill="#F0A57E">lock after promoting</text>
<line x1="1090" y1="130" x2="1170" y2="130" stroke="#11151B" stroke-width="2" marker-end="url(#rg)"></line>
<rect x="1180" y="0" width="500" height="260" fill="#FFFFFF" stroke="#2453C9" stroke-width="3"></rect>
<text x="1204" y="42" font-size="20" font-weight="600" fill="#2453C9">deploy · deployment=True</text>
<text x="1204" y="94" font-size="17" fill="#11151B">cache-first</text>
<text x="1204" y="120" font-size="15" fill="{{okInk}}">{{ok}}</text>
<text x="1204" y="174" font-size="17" fill="#11151B">policy-first</text>
<text x="1204" y="200" font-size="15" fill="{{noInk}}">{{no}}</text>
<text x="1204" y="240" font-size="14" fill="#4A5361">only an evaluated profile</text>
<text x="0" y="330" font-size="18" font-weight="600" fill="#C2541D">TAMPER ON PURPOSE</text>
<rect x="0" y="350" width="500" height="130" fill="#FFFFFF" stroke="#C2541D" stroke-width="2" stroke-dasharray="8 6"></rect>
<text x="24" y="392" font-size="17" fill="#11151B">edit a placement in</text>
<text x="24" y="418" font-size="17" fill="#11151B">labs/profiles.json</text>
<text x="24" y="452" font-size="15" fill="#C2541D">keep the same version</text>
<line x1="500" y1="415" x2="580" y2="415" stroke="#11151B" stroke-width="2" marker-end="url(#rg)"></line>
<rect x="590" y="350" width="500" height="130" fill="#11151B"></rect>
<text x="614" y="404" font-size="18" fill="#FFFFFF">uv run registry.py check</text>
<text x="614" y="440" font-size="15" fill="#B9C3D6">--impl labs</text>
<line x1="1090" y1="415" x2="1170" y2="415" stroke="#11151B" stroke-width="2" marker-end="url(#rg)"></line>
<rect x="1180" y="350" width="500" height="130" fill="#FBF0EA" stroke="#C2541D" stroke-width="3"></rect>
<text x="1204" y="392" font-size="18" font-weight="600" fill="#C2541D">refused</text>
<text x="1204" y="426" font-size="15" fill="{{tInk}}">{{tamper}}</text>
<text x="1204" y="452" font-size="15" fill="#2E3540">then put it back</text>
<text x="0" y="540" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#2E3540">Changing a placement without bumping its version changes the digest. So does promoting, which sets model_family.</text>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.showAnswers ?? false;
    return {
      ok: s ? 'returned, with its suite, date and artifact' : '?', okInk: s ? '#2453C9' : '#9AA3B0',
      no: s ? 'refused: unevaluated (R-19)' : '?', noInk: s ? '#C2541D' : '#9AA3B0',
      tamper: s ? 'digest mismatch for that id and version (R-20)' : '?', tInk: s ? '#11151B' : '#9AA3B0'
    };
  }
}
</script>
</body>
</html>

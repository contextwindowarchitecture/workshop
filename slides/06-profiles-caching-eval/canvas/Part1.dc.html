<script type="text/x-dc" data-dc-script data-props='{"showAnswers":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.showAnswers ?? false;
    const style = {
      instructions: ['#11151B', '#FFFFFF'], account: ['#5C6676', '#FFFFFF'], articles: ['#C2541D', '#FFFFFF'],
      memory: ['#DCE3F5', '#11151B'], history: ['#DCE3F5', '#11151B'], query: ['#2453C9', '#FFFFFF']
    };
    const stack = (order) => {
      const out = {};
      order.forEach((slot, i) => {
        out['a' + i] = s ? { l: slot, f: style[slot][0], t: style[slot][1] } : { l: '?', f: '#FFFFFF', t: '#9AA3B0' };
      });
      return out;
    };
    return {
      p: stack(['instructions', 'account', 'articles', 'memory', 'history', 'query']),
      e: stack(['instructions', 'articles', 'account', 'memory', 'history', 'query']),
      c: stack(['instructions', 'account', 'memory', 'history', 'articles', 'query'])
    };
  }
}
</script>

<html lang="en">
<head>
<meta charset="utf-8">
<title>C2 Support and logistics router</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453C9}a:hover{color:#1A3D96}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>C2 · SUPPORT AND LOGISTICS ROUTER · NORTHWIND OUTDOORS</span>
<span>08 / 13</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Route it, fit it, escalate it, hand it back</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">Answer returns, damage and delivery questions from policy, the record and what support already said. The ticket's next stage is the application's.</p>
</div>
<svg width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="A customer message goes through intent rules to one of three routes, on a small tier, escalating to a large tier on a refusal; the drafter's output is parsed, screened three ways, and the application writes the ticket's next stage. Below, where each input goes, and the coordination point delivery_status:o_7781.">
<defs>
<marker id="c2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11151B"></path></marker>
</defs>
<g font-family="IBM Plex Mono, monospace">
<rect x="0" y="40" width="180" height="120" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="18" y="94" font-size="16" fill="#11151B">a customer</text><text x="18" y="118" font-size="16" fill="#11151B">message</text>
<rect x="220" y="40" width="200" height="120" fill="#2453C9"></rect><text x="238" y="94" font-size="16" fill="#FFFFFF">intent rules</text><text x="238" y="118" font-size="13" fill="#DCE3F5">data/intents.json</text>
<g font-size="15">
<rect x="460" y="20" width="200" height="44" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="476" y="48" fill="#11151B">returns</text>
<rect x="460" y="78" width="200" height="44" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="476" y="106" fill="#11151B">damaged</text>
<rect x="460" y="136" width="200" height="44" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="476" y="164" fill="#11151B">general</text>
</g>
<rect x="700" y="40" width="200" height="120" fill="#11151B"></rect><text x="718" y="94" font-size="16" fill="#FFFFFF">small tier</text><text x="718" y="118" font-size="13" fill="#B9C3D6">refused? escalate</text>
<rect x="940" y="40" width="180" height="120" fill="#11151B"></rect><text x="958" y="94" font-size="16" fill="#FFFFFF">large tier</text>
<rect x="1160" y="40" width="240" height="120" fill="#2453C9"></rect><text x="1178" y="94" font-size="16" fill="#FFFFFF">contract,</text><text x="1178" y="118" font-size="16" fill="#FFFFFF">three screens</text>
<rect x="1440" y="40" width="240" height="120" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="1458" y="94" font-size="16" fill="#11151B">the ticket's</text><text x="1458" y="118" font-size="16" fill="#11151B">next stage</text>
<g stroke="#11151B" stroke-width="2"><line x1="180" y1="100" x2="216" y2="100" marker-end="url(#c2b)"></line><line x1="420" y1="100" x2="456" y2="100" marker-end="url(#c2b)"></line><line x1="660" y1="100" x2="696" y2="100" marker-end="url(#c2b)"></line><line x1="900" y1="100" x2="936" y2="100" marker-end="url(#c2b)"></line><line x1="1120" y1="100" x2="1156" y2="100" marker-end="url(#c2b)"></line><line x1="1400" y1="100" x2="1436" y2="100" marker-end="url(#c2b)"></line></g>
<text x="1440" y="190" font-size="13" fill="#4A5361">written by the application</text>
<text x="0" y="250" font-size="16" font-weight="600" fill="#4A5361">WHERE EACH INPUT GOES</text>
<g font-size="15">
<rect x="0" y="266" width="1040" height="62" fill="#11151B"></rect><text x="20" y="304" fill="#FFFFFF">the ticket and the order: the system of record</text><text x="720" y="304" fill="#B9C3D6">state · current</text>
<rect x="0" y="336" width="1040" height="62" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="20" y="374" fill="#11151B">CRM notes, with hand-written summaries</text><text x="720" y="374" fill="#4A5361">memory · variants · own scope</text>
<rect x="0" y="406" width="1040" height="62" fill="#FFFFFF" stroke="#11151B" stroke-width="2"></rect><text x="20" y="444" fill="#11151B">policy articles</text><text x="720" y="444" fill="#4A5361">dedupe exact · 2 per source</text>
<rect x="0" y="476" width="1040" height="62" fill="#FBF0EA" stroke="#C2541D" stroke-width="2"></rect><text x="20" y="514" fill="#11151B">the customer's phone and email</text><text x="720" y="514" fill="#C2541D">never in any payload</text>
</g>
<rect x="1080" y="250" width="600" height="390" fill="#FFFFFF" stroke="#2453C9" stroke-width="2"></rect>
<text x="1104" y="290" font-size="16" font-weight="600" fill="#2453C9">THE COORDINATION POINT</text>
<text x="1104" y="340" font-size="17" fill="#11151B">delivery_status:o_7781</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#2E3540">
<text x="1104" y="380">orders-db and crm-notes both assert</text>
<text x="1104" y="404">it, and the freeze turns that into a</text>
<text x="1104" y="428">conflict group.</text>
<text x="1104" y="476">Say it at the start. Teams that split</text>
<text x="1104" y="500">producers without agreeing on it</text>
<text x="1104" y="524">lose an hour.</text>
</g>
<text x="1104" y="600" font-size="14" fill="#4A5361">the intent picks the route; the tier is the</text>
<text x="1104" y="620" font-size="14" fill="#4A5361">orchestrator's, from the routes table</text>
</g>
</svg>
</div>
</x-dc>

</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Three domains</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap");</style>
<foreignObject x="0" y="0" width="1920" height="1080">
<div xmlns="http://www.w3.org/1999/xhtml" style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 80px 120px; background: #F4F5F7; color: #11151B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #4A5361">
<span>CAPSTONES/README.MD</span>
<span>04 / 13</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">Three domains, each with its traps built in</h2>
<p style="margin: 0; font-size: 28px; color: #2E3540">C2 was built first: it is closest to Fernway. C1 and C3 add a room that must not instruct and money on the line.</p>
</div>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="640" viewBox="0 0 1680 640" role="img" aria-label="Three columns comparing C1, C2 and C3: their routes, producers and screens, the traps in their data, and what each capstone seeds.">
<g font-family="IBM Plex Mono, monospace">
<g font-size="14" fill="#4A5361"><text x="0" y="116">routes</text><text x="0" y="176">builds</text><text x="0" y="266">the traps</text><text x="0" y="476">seeds</text></g>
<g>
<rect x="160" y="0" width="490" height="80" fill="#2453C9"></rect>
<text x="182" y="36" font-size="20" font-weight="600" fill="#FFFFFF">C1 · scribe, diagnostic</text>
<text x="182" y="62" font-size="14" fill="#DCE3F5">Harbor Street Family Practice</text>
<text x="182" y="116" font-size="16" fill="#11151B">scribe · consult</text>
<text x="182" y="176" font-size="16" fill="#11151B">8 producers · 4 screens</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#11151B">
<text x="182" y="266">a prior note's blood pressure</text><text x="182" y="288">that today's monitor contradicts</text>
<text x="182" y="324">a relayed request for an opioid</text>
<text x="182" y="360">one clinician is a nurse</text>
</g>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#2E3540">
<text x="182" y="476">transcript as untrusted history;</text><text x="182" y="498">the EHR as protected task state;</text><text x="182" y="520">a gated prescription capability;</text><text x="182" y="542">a SOAP-note contract</text>
</g>
</g>
<g>
<rect x="670" y="0" width="490" height="80" fill="#2453C9"></rect>
<text x="692" y="36" font-size="20" font-weight="600" fill="#FFFFFF">C2 · support, logistics</text>
<text x="692" y="62" font-size="14" fill="#DCE3F5">Northwind Outdoors</text>
<text x="692" y="116" font-size="16" fill="#11151B">returns · damaged · general</text>
<text x="692" y="176" font-size="16" fill="#11151B">7 producers · 3 screens</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#11151B">
<text x="692" y="266">one refund paragraph, word for</text><text x="692" y="288">word in two articles</text>
<text x="692" y="324">a CRM note against the order record</text>
<text x="692" y="360">a phone number in a customer's notes</text>
</g>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#2E3540">
<text x="692" y="476">intent-selected routes; CRM history</text><text x="692" y="498">with variants; dedupe and per-source</text><text x="692" y="520">caps; escalation; a PII guard</text>
</g>
</g>
<g>
<rect x="1180" y="0" width="500" height="80" fill="#2453C9"></rect>
<text x="1202" y="36" font-size="20" font-weight="600" fill="#FFFFFF">C3 · wealth, triage</text>
<text x="1202" y="62" font-size="14" fill="#DCE3F5">Larkbridge Wealth</text>
<text x="1202" y="116" font-size="16" fill="#11151B">portfolio · triage</text>
<text x="1202" y="176" font-size="16" fill="#11151B">8 producers · 6 screens</text>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#11151B">
<text x="1202" y="266">the vendor shows 1,200 ACME units</text><text x="1202" y="288">where the ledger has 1,000 settled</text>
<text x="1202" y="324">an advisory and a self-directed client</text>
<text x="1202" y="360">a transfer the client did not make</text>
</g>
<g font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#2E3540">
<text x="1202" y="476">ledger precedence in fact groups;</text><text x="1202" y="498">protected user state; a strict</text><text x="1202" y="520">contract; a trade guard;</text><text x="1202" y="542">cache-stable placement</text>
</g>
</g>
<g stroke="#DADFE7" stroke-width="2"><line x1="0" y1="140" x2="1680" y2="140"></line><line x1="0" y1="206" x2="1680" y2="206"></line><line x1="0" y1="420" x2="1680" y2="420"></line></g>
<text x="0" y="620" font-size="15" fill="#4A5361">every patient, customer, client, clinician, holding and article is fictional teaching material</text>
</g>
</svg>
</div>
</foreignObject>
</svg>

[project]
name = "cwa-capstone-scribe-diagnostic"
version = "0.1.0"
description = "Capstone C1. Scribe and diagnostic assistant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "contextwindowarchitecture-assembler",
    "openai>=2",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.sources]
contextwindowarchitecture-assembler = { git = "https://github.com/contextwindowarchitecture/assembler-python", tag = "draft-release" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

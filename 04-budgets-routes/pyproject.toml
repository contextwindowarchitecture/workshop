[project]
name = "cwa-workshop-04-budgets-routes"
version = "0.1.0"
description = "W4. Budgets, variants, routes and refusals"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "contextwindowarchitecture-assembler",
    "openai>=2",
]

[project.optional-dependencies]
calibrate = ["tiktoken>=0.9"]

[tool.uv]
package = false

[tool.uv.sources]
contextwindowarchitecture-assembler = { git = "https://github.com/contextwindowarchitecture/assembler-python", tag = "draft-release" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
